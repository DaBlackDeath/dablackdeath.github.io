<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACKDEATH – CP4 KAWAII</title>

<style>
/* =========================================================
    GLOBAL & LAYOUT (Zentrierung & 10px Rand)
========================================================= */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: #fff6fb;
    font-family: system-ui, sans-serif;
    color: #ff8ac9;

    margin: 0;
    padding: 10px;

    min-height: 100dvh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
    position: relative;
}

/* =========================================================
    KAWAII BACKGROUND
========================================================= */
#kawaii-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    pointer-events: none;
}

/* =========================================================
    PLAYER BOX (Auf Hochformat fixiert)
========================================================= */
.cyber-player-box {
    width: 100%;
    max-width: 420px;

    height: calc(100dvh - 20px);

    background: rgba(255,255,255,.8);
    border: 2px solid rgba(255,180,220,.6);
    border-radius: 20px;
    padding: 20px;

    box-shadow:
        0 0 25px rgba(255,180,220,.4),
        inset 0 0 20px rgba(255,255,255,.8);

    backdrop-filter: blur(14px);

    position: relative;
    z-index: 10;

    display: flex;
    flex-direction: column;

    overflow: hidden;
}

.cyber-player-title {
    text-align: center;
    font-size: 1.1rem;
    letter-spacing: 3px;
    margin-bottom: 16px;
    color: #ff6fb7;
    font-weight: 900;
    text-shadow: 0 0 10px #ffc8e8, 0 0 20px #ffb7d5;
}

/* =========================================================
    CONTROLS & BUTTONS
========================================================= */
.cyber-player-controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 14px;
}

.cyber-btn {
    background: linear-gradient(135deg, #ffc8e8, #ffd8b8, #c8fff1);
    border: none;
    flex: 1;
    min-height: 44px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 0 #e5b4c8, 0 0 10px rgba(255, 180, 220, 0.6);
    transition: 0.1s;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Kawaii SVG Styling */
.cyber-btn svg {
    width: 22px;
    height: 22px;
    fill: #7a4a5a;
    transition: transform 0.1s;
}

.cyber-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 0 #e5b4c8, 0 0 14px rgba(255, 150, 200, 0.9);
}

.cyber-btn:hover svg {
    transform: scale(1.05);
}

.cyber-btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #e5b4c8, 0 0 6px rgba(255, 150, 200, 0.6);
}

/* =========================================================
    SEEK & LOOP
========================================================= */
.cyber-loop-label {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 12px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
}

.cyber-loop-label input {
    accent-color: #ff8ac9;
    cursor: pointer;
}

.cyber-seek {
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: linear-gradient(90deg, #ffc8e8, #ffd8b8, #c8fff1);
    margin-bottom: 14px;
    -webkit-appearance: none;
    cursor: pointer;
}

.cyber-seek::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #ffffff;
    border: 2px solid #ff8ac9;
    box-shadow: 0 0 10px #ff8ac9;
}

/* =========================================================
    PLAYLIST & VISUALIZER
========================================================= */
.cyber-playlist {
    flex: 1;

    min-height: 0;

    overflow-y: auto;

    text-align: center;

    margin-bottom: 10px;

    scrollbar-width: thin;
    scrollbar-color: #ffc8e8 rgba(255,255,255,.3);
}

.cyber-playlist::-webkit-scrollbar { width: 6px; }
.cyber-playlist::-webkit-scrollbar-track { background: rgba(255,255,255,0.3); border-radius: 10px; }
.cyber-playlist::-webkit-scrollbar-thumb { background-color: #ffc8e8; border-radius: 10px; }

.cyber-track {
    padding: 10px;
    margin-bottom: 6px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.6);
    border: 1px solid rgba(255, 180, 220, 0.4);
    cursor: pointer;
    color: #7a4a5a;
    font-weight: 700;
    transition: 0.15s;
}

.cyber-track:hover { background: rgba(255, 200, 230, 0.8); }
.cyber-track.active {
    background: linear-gradient(90deg, #ffc8e8, #ffd8b8, #c8fff1);
    color: #7a4a5a;
    border-color: #ff8ac9;
    box-shadow: 0 0 12px #ffc8e8, 0 0 18px #ffb7d5;
}

#cyberVisualizer {
    width: 100%;
    height: 70px;

    flex-shrink: 0;

    background: rgba(255,255,255,.6);
    border: 2px solid rgba(255,180,220,.4);
    border-radius: 16px;

    box-shadow: inset 0 0 10px rgba(255,255,255,.9);
}
</style>
</head>
<body>

<canvas id="kawaii-bg"></canvas>

<div class="cyber-player-box">
    <div class="cyber-player-title">AUDIO NODE // KAWAII MODE</div>

    <div class="cyber-player-controls">
        <button class="cyber-btn prev" aria-label="Zurück">
            <svg viewBox="0 0 24 24">
                <path d="M11.5 12l6.5-5.5c.5-.4.5 1 .5 1.5v8c0 .5 0 1.9-.5 1.5L11.5 12zm-7 0L11 6.5c.5-.4.5 1 .5 1.5v8c0 .5 0 1.9-.5 1.5L4.5 12z" stroke-linejoin="round" stroke-linecap="round"/>
            </svg>
        </button>
        
        <button class="cyber-btn play" aria-label="Abspielen">
            <svg viewBox="0 0 24 24">
                <path d="M7.5 5.3c0-.8.9-1.3 1.6-.8l10.2 6.7c.6.4.6 1.3 0 1.7L9.1 19.5c-.7.5-1.6 0-1.6-.8V5.3z" stroke-linejoin="round" stroke-linecap="round"/>
            </svg>
        </button>
        
        <button class="cyber-btn pause" aria-label="Pause">
            <svg viewBox="0 0 24 24">
                <rect x="5.5" y="4.5" width="4" height="15" rx="2"/>
                <rect x="14.5" y="4.5" width="4" height="15" rx="2"/>
            </svg>
        </button>
        
        <button class="cyber-btn stop" aria-label="Stopp">
            <svg viewBox="0 0 24 24">
                <rect x="4.5" y="4.5" width="15" height="15" rx="4"/>
            </svg>
        </button>
        
        <button class="cyber-btn next" aria-label="Weiter">
            <svg viewBox="0 0 24 24">
                <path d="M12.5 12L6 6.5c-.5-.4-.5 1-.5 1.5v8c0 .5 0 1.9.5 1.5l6.5-5.5zm7 0l-6.5-5.5c-.5-.4-.5 1-.5 1.5v8c0 .5 0 1.9.5 1.5l6.5-5.5z" stroke-linejoin="round" stroke-linecap="round"/>
            </svg>
        </button>
    </div>

    <label class="cyber-loop-label">
        <input type="checkbox" class="loop" checked>
        LOOP ENABLED
    </label>

    <input type="range" class="cyber-seek" value="0" min="0" max="100" step="0.1">

    <div class="cyber-playlist"></div>

    <canvas id="cyberVisualizer" width="400" height="80"></canvas>
</div>

<script>
/* =========================================================
    AUDIO LOGIC
========================================================= */
class CyberPlaylistPlayer {
    constructor(root, playlist) {
        this.root = root;
        this.playlist = playlist;
        this.currentIndex = 0;

        this.ctx = null;
        this.sourceNode = null;
        this.analyser = null;
        this.dataArray = null;
        
        this.audioBuffer = null; 
        this.isPlaying = false;
        this.startTime = 0;      
        this.pauseTime = 0;      
        this.loop = true;
        this.isDragging = false;

        this.buildRefs();
        this.renderPlaylist();
        this.loadTrack(0, false);
    }

    buildRefs() {
        this.playBtn = this.root.querySelector(".play");
        this.pauseBtn = this.root.querySelector(".pause");
        this.stopBtn = this.root.querySelector(".stop");
        this.prevBtn = this.root.querySelector(".prev");
        this.nextBtn = this.root.querySelector(".next");
        this.seek = this.root.querySelector(".cyber-seek");
        this.loopToggle = this.root.querySelector(".loop");
        this.listBox = this.root.querySelector(".cyber-playlist");

        this.playBtn.onclick = () => this.play();
        this.pauseBtn.onclick = () => this.pause();
        this.stopBtn.onclick = () => this.stop();
        this.prevBtn.onclick = () => this.prevTrack();
        this.nextBtn.onclick = () => this.nextTrack();

        this.loopToggle.onchange = () => {
            this.loop = this.loopToggle.checked;
            if (this.sourceNode) {
                this.sourceNode.loop = this.loop;
            }
        };

        this.seek.oninput = () => { this.isDragging = true; };
        this.seek.onchange = () => {
            if (!this.audioBuffer) return;
            const targetTime = (this.seek.value / 100) * this.audioBuffer.duration;
            if (this.isPlaying) {
                this.stopSource();
                this.play(targetTime);
            } else {
                this.pauseTime = targetTime;
            }
            this.isDragging = false;
        };

        this.seek.onmouseup = () => { this.isDragging = false; };
        this.seek.ontouchend = () => { this.isDragging = false; };
        
        const updateProgress = () => {
            this.updateSeek();
            requestAnimationFrame(updateProgress);
        };
        requestAnimationFrame(updateProgress);
    }

    renderPlaylist() {
        this.listBox.innerHTML = "";
        this.playlist.forEach((track, i) => {
            const item = document.createElement("div");
            item.className = "cyber-track" + (i === this.currentIndex ? " active" : "");
            item.textContent = track.name;
            item.onclick = () => this.loadTrack(i, true);
            this.listBox.appendChild(item);
        });
    }

    highlightActive() {
        this.listBox.querySelectorAll(".cyber-track").forEach((el, i) => {
            const isActive = i === this.currentIndex;
            el.classList.toggle("active", isActive);
            if (isActive) {
                el.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }
        });
    }

    initAudioEngine() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.analyser = this.ctx.createAnalyser();
            this.analyser.fftSize = 128;
            this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
            this.analyser.connect(this.ctx.destination);
        }
    }

    async loadTrack(index, autoplay = false) {
        this.currentIndex = index;
        this.highlightActive();
        this.initAudioEngine();
        this.stopSource();
        
        this.audioBuffer = null;
        this.pauseTime = 0;
        this.seek.value = 0;

        if (this.playlist && this.playlist[index]) {
            try {
                const response = await fetch(this.playlist[index].src);
                const arrayBuffer = await response.arrayBuffer();
                this.audioBuffer = await this.ctx.decodeAudioData(arrayBuffer);
                
                if (autoplay) {
                    this.play();
                }
            } catch (e) {
                console.error("Fehler beim Dekodieren der Audiodatei:", e);
            }
        }
    }

    play(resumeTime = null) {
        this.initAudioEngine();
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }

        if (!this.audioBuffer || this.isPlaying) return;

        this.sourceNode = this.ctx.createBufferSource();
        this.sourceNode.buffer = this.audioBuffer;
        this.sourceNode.loop = this.loop;
        this.sourceNode.connect(this.analyser);

        const offset = resumeTime !== null ? resumeTime : this.pauseTime;
        this.sourceNode.start(0, offset);
        
        this.startTime = this.ctx.currentTime - offset;
        this.isPlaying = true;

        this.sourceNode.onended = () => {
            if (!this.sourceNode.loop && this.isPlaying && (this.ctx.currentTime - this.startTime >= this.audioBuffer.duration - 0.1)) {
                this.isPlaying = false;
                this.nextTrack();
            }
        };

        if (!this.visualizerActive) {
            this.visualizerActive = true;
            renderVisualizer(this);
        }
    }

    pause() {
        if (this.isPlaying) {
            this.pauseTime = this.ctx.currentTime - this.startTime;
            this.stopSource();
        }
    }

    stop() {
        this.pauseTime = 0;
        this.stopSource();
        this.seek.value = 0;
    }

    stopSource() {
        if (this.sourceNode) {
            try { this.sourceNode.stop(); } catch(e){}
            this.sourceNode.disconnect();
            this.sourceNode = null;
        }
        this.isPlaying = false;
    }

    nextTrack() {
        const nextIndex = (this.currentIndex + 1) % this.playlist.length;
        this.loadTrack(nextIndex, true);
    }

    prevTrack() {
        const prevIndex = (this.currentIndex - 1 + this.playlist.length) % this.playlist.length;
        this.loadTrack(prevIndex, true);
    }

    updateSeek() {
        if (this.isDragging || !this.isPlaying || !this.audioBuffer) return;

        let currentPosition = this.ctx.currentTime - this.startTime;
        if (this.loop) {
            currentPosition = currentPosition % this.audioBuffer.duration;
        }
        this.seek.value = (currentPosition / this.audioBuffer.duration) * 100;
    }
}


/* =========================================================
    VISUALIZER RENDERER
========================================================= */
const vizCanvas = document.getElementById("cyberVisualizer");
const vizCtx = vizCanvas.getContext("2d");


function renderVisualizer(player) {
    if (!player || !player.analyser || !player.source) {
        player.visualizerAnimationId = null;
        return;
    }

    player.visualizerAnimationId = requestAnimationFrame(() => renderVisualizer(player));
    player.analyser.getByteFrequencyData(player.dataArray);

    const w = vizCanvas.width;
    const h = vizCanvas.height;
    vizCtx.clearRect(0, 0, w, h);

    const barCount = player.dataArray.length * 0.8;
    const barWidth = w / barCount;

    for (let i = 0; i < barCount; i++) {
        const v = player.dataArray[i] / 255;
        const barHeight = v * h;
        const x = i * barWidth;
        const y = h - barHeight;
        const t = i / barCount;

        let r, g, b;
        if (t < 0.5) {
            const k = t / 0.5;
            r = 255; g = 200 - (200 - 216) * k; b = 230 - (230 - 184) * k;
        } else {
            const k = (t - 0.5) / 0.5;
            r = 255 - (255 - 200) * k; g = 216 - (216 - 255) * k; b = 184 - (184 - 241) * k;
        }

        vizCtx.fillStyle = `rgba(${r},${g},${b},${0.4 + v * 0.6})`;
        const radius = 3;
        const bw = barWidth * 0.75;
        const bx = x + (barWidth - bw) / 2;

        if (barHeight > radius * 2) {
            vizCtx.beginPath();
            vizCtx.moveTo(bx + radius, y);
            vizCtx.lineTo(bx + bw - radius, y);
            vizCtx.quadraticCurveTo(bx + bw, y, bx + bw, y + radius);
            vizCtx.lineTo(bx + bw, y + barHeight);
            vizCtx.lineTo(bx, y + barHeight);
            vizCtx.lineTo(bx, y + radius);
            vizCtx.quadraticCurveTo(bx, y, bx + radius, y);
            vizCtx.closePath();
            vizCtx.fill();
        } else if (barHeight > 0) {
             vizCtx.fillRect(bx, y, bw, barHeight);
        }
    }
}

/* =========================================================
    ANIMATED BACKGROUND LOGIC (PERFEKT VERTEILT)
========================================================= */
const bgCanvas = document.getElementById("kawaii-bg");
const bgCtx = bgCanvas.getContext("2d");

bgCanvas.width = window.innerWidth;
bgCanvas.height = window.innerHeight;

const kawaiiSprites = [
    {emoji: "💖", size: 24}, {emoji: "☁️", size: 28}, {emoji: "⭐", size: 20},
    {emoji: "🌈", size: 26}, {emoji: "🍰", size: 22}, {emoji: "🎀", size: 22},
    {emoji: "🐰", size: 22}, {emoji: "🐭", size: 22}, {emoji: "🧸", size: 22},
    {emoji: "🐼", size: 22}, {emoji: "🐸", size: 22}, {emoji: "🐱", size: 22}
];

function createParticle(isInitial = false) {
    return {
        x: Math.random() * bgCanvas.width,
        y: isInitial ? Math.random() * bgCanvas.height : bgCanvas.height + 40,
        speed: 0.4 + Math.random() * 0.8,
        sprite: kawaiiSprites[Math.floor(Math.random() * kawaiiSprites.length)],
        opacity: 0.4 + Math.random() * 0.5,
        wobble: Math.random() * Math.PI * 2,
        wobbleSpeed: 0.01 + Math.random() * 0.02
    };
}

const particles = Array.from({length: 40}, () => createParticle(true));

function resizeBg() {
    const oldWidth = bgCanvas.width;
    const oldHeight = bgCanvas.height;
    const newWidth = window.innerWidth;
    const newHeight = window.innerHeight;
    
    bgCanvas.width = newWidth;
    bgCanvas.height = newHeight;
    
    particles.forEach(p => {
        p.x = (p.x / oldWidth) * newWidth;
        p.y = (p.y / oldHeight) * newHeight;
    });
}
window.addEventListener("resize", resizeBg);

function drawBackground() {
    bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
    bgCtx.textBaseline = "middle";
    bgCtx.textAlign = "center";

    particles.forEach(p => {
        bgCtx.globalAlpha = p.opacity;
        bgCtx.font = `${p.sprite.size}px sans-serif`;
        
        const xFinal = p.x + Math.sin(p.wobble) * 15;
        bgCtx.fillText(p.sprite.emoji, xFinal, p.y);
        
        p.y -= p.speed;
        p.wobble += p.wobbleSpeed;
        
        if (p.y < -40) {
            Object.assign(p, createParticle(false));
        }
    });
    
    bgCtx.globalAlpha = 1.0;
    requestAnimationFrame(drawBackground);
}

drawBackground();

/* =========================================================
    INIT PLAYER
========================================================= */
async function initPlayer() {
    try {
        const response = await fetch("assets/playlist.json");
        const playlist = await response.json();
        const playerRoot = document.querySelector(".cyber-player-box");
        window.cyberPlayer = new CyberPlaylistPlayer(playerRoot, playlist);
    } catch (e) {
        console.error("Fehler beim Laden der Playlist:", e);
        const fallbackPlaylist = [{name: "assets/playlist.json fehlt!", src: ""}];
        const playerRoot = document.querySelector(".cyber-player-box");
        window.cyberPlayer = new CyberPlaylistPlayer(playerRoot, fallbackPlaylist);
    }
}

if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initPlayer);
} else {
    initPlayer();
}
</script>

</body>
</html>
