<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>BLACKDEATH – CP4 KAWAII</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">

<style>
/* =========================================================
   GLOBAL
========================================================= */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: #fff6fb;
    font-family: 'Nunito', sans-serif;
    overflow: hidden;
    color: #ff8ac9;
}

/* =========================================================
   THEME SWITCH (oben rechts)
========================================================= */
.theme-switch {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    gap: 10px;
    z-index: 9999;
}

.theme-switch a {
    padding: 6px 12px;
    border-radius: 10px;
    font-size: 0.75rem;
    text-decoration: none;
    font-weight: 700;
    background: rgba(255,255,255,0.7);
    border: 1px solid rgba(255,150,200,0.6);
    color: #ff6fb7;
    backdrop-filter: blur(6px);
    transition: 0.15s;
}

.theme-switch a:hover {
    background: rgba(255,200,230,0.9);
    box-shadow: 0 0 10px rgba(255,150,200,0.6);
}

/* =========================================================
   STARFIELD BACKGROUND
========================================================= */
#starfield {
    position: fixed;
    inset: 0;
    z-index: -1;
}

/* =========================================================
   TITLE (KAWAII)
========================================================= */
.title {
    position: fixed;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 3rem;
    letter-spacing: 6px;
    color: #ff8ac9;
    font-weight: 900;
    text-shadow:
        0 0 10px #ffc8e8,
        0 0 20px #ffb7d5;
}

/* =========================================================
   PLAYER BOX (KAWAII PASTEL)
========================================================= */
.cyber-player-box {
    position: fixed;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    width: 50%;
    min-width: 500px;
    max-width: 900px;

    background: rgba(255,255,255,0.7);
    border: 2px solid rgba(255,180,220,0.6);
    border-radius: 20px;
    padding: 20px 24px 16px 24px;

    box-shadow:
        0 0 25px rgba(255,180,220,0.4),
        inset 0 0 20px rgba(255,255,255,0.8);

    backdrop-filter: blur(14px);
}

.cyber-player-title {
    text-align: center;
    font-size: 1.1rem;
    letter-spacing: 3px;
    margin-bottom: 12px;
    color: #ff6fb7;
    font-weight: 900;
    text-shadow:
        0 0 10px #ffc8e8,
        0 0 20px #ffb7d5;
}

/* =========================================================
   BUTTONS (MOCHI STYLE)
========================================================= */
.cyber-player-controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 12px;
}

.cyber-btn {
    background: linear-gradient(135deg, #ffc8e8, #ffd8b8, #c8fff1);
    color: #7a4a5a;
    border: none;
    padding: 10px 18px;
    border-radius: 999px;
    font-weight: 900;
    cursor: pointer;
    font-size: 0.9rem;
    box-shadow:
        0 4px 0 #e5b4c8,
        0 0 10px rgba(255,180,220,0.6);
    transition: 0.15s;
}

.cyber-btn:hover {
    transform: translateY(-2px);
    box-shadow:
        0 6px 0 #e5b4c8,
        0 0 14px rgba(255,150,200,0.9);
}

.cyber-btn:active {
    transform: translateY(2px);
    box-shadow:
        0 2px 0 #e5b4c8,
        0 0 6px rgba(255,150,200,0.6);
}

/* =========================================================
   LOOP + SEEK
========================================================= */
.cyber-loop-label {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 10px;
    font-size: 0.85rem;
    color: #ff8ac9;
}

.cyber-loop-label input {
    accent-color: #ff8ac9;
}

.cyber-seek {
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: linear-gradient(90deg, #ffc8e8, #ffd8b8, #c8fff1);
    margin-bottom: 12px;
    -webkit-appearance: none;
}

.cyber-seek::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #ffffff;
    border: 2px solid #ff8ac9;
    box-shadow: 0 0 10px #ff8ac9;
}

/* =========================================================
   PLAYLIST
========================================================= */
.cyber-playlist {
    text-align: center;
    max-height: 180px;
    overflow-y: auto;
}

.cyber-track {
    padding: 8px 10px;
    margin-bottom: 6px;
    border-radius: 12px;
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(255,180,220,0.4);
    cursor: pointer;
    transition: 0.15s;
    color: #7a4a5a;
    font-weight: 700;
}

.cyber-track:hover {
    background: rgba(255,200,230,0.8);
}

.cyber-track.active {
    background: linear-gradient(90deg, #ffc8e8, #ffd8b8, #c8fff1);
    color: #7a4a5a;
    border-color: #ff8ac9;
    box-shadow:
        0 0 12px #ffc8e8,
        0 0 18px #ffb7d5;
}

/* =========================================================
   VISUALIZER
========================================================= */
#cyberVisualizer {
    width: 100%;
    height: 140px;
    background: rgba(255,255,255,0.6);
    border: 2px solid rgba(255,180,220,0.4);
    border-radius: 16px;
    margin-top: 10px;
    box-shadow:
        0 0 18px rgba(255,180,220,0.35),
        inset 0 0 18px rgba(255,255,255,0.9);
}

.logo{
    position:fixed;
    opacity: 1.0;
    left:50%;
    top:22%;
    transform:translate(-50%, -50%);
    width:min(75vw, 50vh);
    z-index:10;
    animation:float 5s ease-in-out infinite;
    filter:
        drop-shadow(0 0 20px rgba(255,255,255,0.7))
        drop-shadow(0 0 40px #ff9eea)
        drop-shadow(0 0 60px #8eeeff);
}

@keyframes float{
    0%,100%{
        transform:
            translate(-50%, -50%)
            translateY(0px);
    }
    50%{
        transform:
            translate(-50%, -50%)
            translateY(-25px);
    }
}
</style>
</head>
<body>

<div class="theme-switch">
    <a href="blackdeath_cp1_amber.html">AMBER</a>
    <a href="blackdeath_cp2_synthwave.html">SYNTHWAVE</a>
    <a href="blackdeath_cp3_darktech.html">DARKTECH</a>
    <a href="blackdeath_cp4_kawaii.html">KAWAII</a>
    <a href="blackdeath_cp5_holo.html">HOLO</a>
</div>

<canvas id="starfield"></canvas>

<img
    class="logo"
    src="assets/img_player/kawaii_logo_2.webp"
    alt="Logo"
>

<div class="cyber-player-box">
    <div class="cyber-player-title">AUDIO NODE // KAWAII MODE</div>

    <div class="cyber-player-controls">
        <button class="cyber-btn prev">⏮</button>
        <button class="cyber-btn play">▶</button>
        <button class="cyber-btn pause">⏸</button>
        <button class="cyber-btn stop">⏹</button>
        <button class="cyber-btn next">⏭</button>
    </div>

    <label class="cyber-loop-label">
        <input type="checkbox" class="loop" checked>
        LOOP ENABLED
    </label>

    <input type="range" class="cyber-seek" value="0" min="0" max="100" step="0.1">

    <div class="cyber-playlist"></div>

    <canvas id="cyberVisualizer" width="800" height="140"></canvas>
</div>

<script>
/* =========================================================
   CYBERPUNK PLAYER (KAWAII)
========================================================= */
class CyberPlaylistPlayer{
    constructor(root,playlist){
        this.root = root;
        this.playlist = playlist;
        this.currentIndex = 0;

        this.ctx = null;
        this.source = null;
        this.audioCache = {}; 

        this.analyser = null;
        this.dataArray = null;

        this.startTime = 0;
        this.pauseTime = 0;
        this.loop = true;

        this.buildRefs();
        this.loadTrack(0);
    }

    buildRefs(){
        this.playBtn = this.root.querySelector(".play");
        this.pauseBtn = this.root.querySelector(".pause");
        this.stopBtn = this.root.querySelector(".stop");
        this.prevBtn = this.root.querySelector(".prev");
        this.nextBtn = this.root.querySelector(".next");
        this.seek = this.root.querySelector(".cyber-seek");
        this.loopToggle = this.root.querySelector(".loop");
        this.listBox = this.root.querySelector(".cyber-playlist");

        this.playBtn.onclick = ()=>this.play();
        this.pauseBtn.onclick = ()=>this.pause();
        this.stopBtn.onclick = ()=>this.stop();
        this.prevBtn.onclick = ()=>this.prevTrack();
        this.nextBtn.onclick = ()=>this.nextTrack();

        this.loopToggle.onchange = ()=> {
            this.loop = this.loopToggle.checked;
            if(this.source) {
                this.source.loop = this.loop;
            }
        };

        this.seek.oninput = ()=>{
            const buffer = this.audioCache[this.currentIndex];
            if(!buffer){ return; }
            this.pauseTime = (this.seek.value / 100) * buffer.duration;
        };

        this.seek.onchange = ()=>{
            if(!this.audioCache[this.currentIndex]){ return; }
            if(this.source){
                this.source.onended = null;
                try{ this.source.stop(0); }catch(e){}
                this.source.disconnect();
                this.source = null;
            }
            this.play();
        };

        this.renderPlaylist();
    }

    renderPlaylist(){
        this.listBox.innerHTML = "";
        this.playlist.forEach((track,i)=>{
            const item = document.createElement("div");
            item.className = "cyber-track" + (i===this.currentIndex ? " active" : "");
            item.textContent = track.name;
            item.onclick = ()=>this.loadTrack(i,true);
            this.listBox.appendChild(item);
        });
    }

    highlightActive(){
        this.listBox.querySelectorAll(".cyber-track").forEach((el,i)=>{
            const isActive = i === this.currentIndex;
            el.classList.toggle("active", isActive);
            if (isActive) {
                el.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }
        });
    }

    async init(){
        if(!this.ctx){
            this.ctx = new AudioContext();
        }
    }

    async preloadTrack(index) {
    await this.init();

    const jobs = this.playlist.map(async (item, i) => {
        if (this.audioCache[i]) return;

        try {
            const data = await fetch(item.src).then(r => r.arrayBuffer());
            const decoded = await this.ctx.decodeAudioData(data);
            this.audioCache[i] = decoded;
        } catch (e) {
            console.error("Fehler:", item.src, e);
        }
    });

    await Promise.all(jobs);
    console.log("Alle Tracks vorgeladen.");
    }

    async loadTrack(index, autoplay=false){
        this.stop();
        this.currentIndex = index;
        this.highlightActive();
        await this.init();

        this.pauseTime = 0;
        this.seek.value = 0;

        if (!this.audioCache[index]) {
            await this.preloadTrack(index);
        }

        if(autoplay){
            this.play();
        }

        const nextIndex = (index + 1) % this.playlist.length;
        const prevIndex = (index - 1 + this.playlist.length) % this.playlist.length;
        this.preloadTrack(nextIndex);
        this.preloadTrack(prevIndex);
    }

    play(){
        const buffer = this.audioCache[this.currentIndex];
        if(!buffer){ return; }

        if(this.source){
            this.source.onended = null;
            try{ this.source.stop(0); }catch(e){}
            this.source.disconnect();
            this.source = null;
        }

        this.source = this.ctx.createBufferSource();
        this.source.buffer = buffer;
        this.source.loop = this.loop;

        if(!this.analyser){
            this.analyser = this.ctx.createAnalyser();
            this.analyser.fftSize = 128;
            this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
        }

        this.source.connect(this.analyser);
        this.analyser.connect(this.ctx.destination);

        // KORREKTUR 1: onended Handler eingebaut
        this.source.onended = () => {
            if (!this.loop) {
                if (this.source) {
                    this.source.onended = null;
                }
                this.source = null;
                this.pauseTime = 0;
                this.seek.value = 0;
                
                const nextIndex = (this.currentIndex + 1) % this.playlist.length;
                this.loadTrack(nextIndex, true);
            }
        };

        this.startTime = this.ctx.currentTime - this.pauseTime;
        this.source.start(0, this.pauseTime);

        this.updateSeek();
        renderVisualizer(this);
    }

    pause(){
        if(!this.source){ return; }
        const pos = this.ctx.currentTime - this.startTime;
        this.pauseTime = pos;
        this.source.onended = null;
        try{ this.source.stop(0); }catch(e){}
        this.source.disconnect();
        this.source = null;
    }

    stop(){
        if(this.source){
            this.source.onended = null;
            try{ this.source.stop(0); }catch(e){}
            this.source.disconnect();
        }
        this.source = null;
        this.pauseTime = 0;
        this.seek.value = 0;
    }

    nextTrack(){
        this.stop();
        this.loadTrack((this.currentIndex+1) % this.playlist.length, true);
    }

    prevTrack(){
        this.stop();
        this.loadTrack((this.currentIndex-1 + this.playlist.length) % this.playlist.length, true);
    }

    updateSeek(){
        // KORREKTUR 2: Abbruch-Fix eingebaut
        if(!this.source){ return; }
        const buffer = this.audioCache[this.currentIndex];
        if(!buffer) return;

        const pos = (this.ctx.currentTime - this.startTime) % buffer.duration;
        this.seek.value = (pos / buffer.duration) * 100;

        requestAnimationFrame(()=>this.updateSeek());
    }
}

/* =========================================================
   VISUALIZER
========================================================= */
const vizCanvas = document.getElementById("cyberVisualizer");
const vizCtx = vizCanvas.getContext("2d");

function renderVisualizer(player) {
    if (!player || !player.analyser) return;

    player.analyser.getByteFrequencyData(player.dataArray);

    const w = vizCanvas.width;
    const h = vizCanvas.height;
    vizCtx.clearRect(0, 0, w, h);

    const barCount = player.dataArray.length / 2;
    const barWidth = w / barCount;

    for (let i = 0; i < barCount; i++) {
        const v = player.dataArray[i] / 255;
        const barHeight = v * (h - 20);

        const x = i * barWidth;
        const y = h - barHeight;
        const t = i / barCount;

        let r, g, b;
        if (t < 0.5) {
            const k = t / 0.5;
            r = 255;
            g = 200 - (200 - 216) * k;
            b = 230 - (230 - 184) * k;
        } else {
            const k = (t - 0.5) / 0.5;
            r = 255 - (255 - 200) * k;
            g = 216 - (216 - 255) * k;
            b = 184 - (184 - 241) * k;
        }

        const alpha = 0.3 + v * 0.7;
        vizCtx.fillStyle = `rgba(${r},${g},${b},${alpha})`;

        const radius = 6;
        const bw = barWidth * 0.7;
        const bx = x + (barWidth - bw) / 2;

        vizCtx.beginPath();
        vizCtx.moveTo(bx + radius, y);
        vizCtx.lineTo(bx + bw - radius, y);
        vizCtx.quadraticCurveTo(bx + bw, y, bx + bw, y + radius);
        vizCtx.lineTo(bx + bw, y + barHeight - radius);
        vizCtx.quadraticCurveTo(bx + bw, y + barHeight, bx + bw - radius, y + barHeight);
        vizCtx.lineTo(bx + radius, y + barHeight);
        vizCtx.quadraticCurveTo(bx, y + barHeight, bx, y + barHeight - radius);
        vizCtx.lineTo(bx, y + radius);
        vizCtx.quadraticCurveTo(bx, y, bx + radius, y);
        vizCtx.closePath();
        vizCtx.fill();
    }

    requestAnimationFrame(() => renderVisualizer(player));
}

/* =========================================================
   PLAYLIST INIT
========================================================= */
async function initPlayer() {
    try {
	localStorage.setItem("lastCyberPlayer", "blackdeath_cp4_kawaii.html");
	window.history.replaceState({}, document.title, "/");
        const response = await fetch("assets/playlist.json");
        const playlist = await response.json();
        const playerRoot = document.querySelector(".cyber-player-box");
        const cyberPlayer = new CyberPlaylistPlayer(playerRoot, playlist);
    } catch (e) {
        console.error("Fehler beim Laden des Players:", e);
    }
}
initPlayer();
</script>

<canvas id="kawaii-bg"></canvas>
<script>
const canvas = document.getElementById("kawaii-bg");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const kawaiiSprites = [
  {emoji: "💖", size: 24}, {emoji: "☁️", size: 28}, {emoji: "⭐", size: 20},
  {emoji: "🌈", size: 26}, {emoji: "🍰", size: 22}, {emoji: "🎀", size: 22},
  {emoji: "🐰", size: 22}, {emoji: "🐭", size: 22}, {emoji: "🧸", size: 22},
  {emoji: "🐼", size: 22}, {emoji: "🐸", size: 22}, {emoji: "🐱", size: 22}
];

const particles = Array.from({length: 60}, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  speed: 0.3 + Math.random() * 0.7,
  sprite: kawaiiSprites[Math.floor(Math.random() * kawaiiSprites.length)],
  opacity: 0.6 + Math.random() * 0.4
}));

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    ctx.globalAlpha = p.opacity;
    ctx.font = `${p.sprite.size}px "Comic Sans MS"`;
    ctx.fillText(p.sprite.emoji, p.x, p.y);
    p.y -= p.speed;
    if (p.y < -30) {
      p.y = canvas.height + 30;
      p.x = Math.random() * canvas.width;
    }
  });
  requestAnimationFrame(draw);
}
draw();

window.addEventListener("resize", () => {
  const oldWidth = canvas.width;
  const oldHeight = canvas.height;
  const newWidth = window.innerWidth;
  const newHeight = window.innerHeight;

  canvas.width = newWidth;
  canvas.height = newHeight;

  particles.forEach(p => {
    p.x *= (newWidth / oldWidth);
    p.y *= (newHeight / oldHeight);
  });
});
</script>
