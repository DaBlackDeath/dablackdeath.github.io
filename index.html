<!DOCTYPE html>
<html lang="de">
<head>
<style>
html { visibility: hidden; }
</style>

<script>
// --- Smartphone-Erkennung so früh wie möglich ---
(function() {
    const isSmartphone =
        window.matchMedia("(pointer: coarse)").matches &&
        window.matchMedia("(max-width: 768px)").matches;

    if (isSmartphone) {
        window.location.replace("mobile.html");
    } else {
        // Desktop / TV / Box → Seite anzeigen
        document.documentElement.style.visibility = "visible";
    }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
window.addEventListener("load", () => {

    const isMobile =
        /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

    if (isMobile) {
        window.location.replace("mobile.html");
    }

});
</script>
<title>CRT Edition - Boot, Parallax & Symmetrical Visualizer</title>

<style>
/* --- RESET --- */
* { margin:0; padding:0; box-sizing:border-box; }

body, html {
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    background: #050505;
    font-family: sans-serif;
}

:root {
    --crt-line: 0px;
}

/* --- CRT BOOTSCREEN --- */
#crtBoot {
    position:fixed; inset:0;
    background:#000;
    z-index:40000;
}

.crtBoot-inner {
    padding:60px;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    align-items:flex-start;
}

#crtBoot::after {
    content:"";
    position:absolute; inset:0;
    background:
        linear-gradient(90deg, rgba(255,255,255,0.04) 2px, transparent 2px),
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size:3px 100%, 100% 3px;
    mix-blend-mode:screen;
    animation:crtFlicker .12s infinite;
    pointer-events: none;
}

.crtBoot-flash {
    position:absolute; inset:0;
    background:radial-gradient(circle, rgba(255,255,255,0.9), rgba(255,255,255,0) 60%);
    opacity:0;
    animation:crtFlash .6s ease-out forwards;
    pointer-events: none;
}

.crtBoot-warp {
    position:absolute; inset:-10%;
    background:radial-gradient(circle at center, rgba(0,255,120,0.15), rgba(0,0,0,0.9) 60%);
    mix-blend-mode:screen;
    filter:blur(12px);
    opacity:0;
    animation:crtWarp 1.4s ease-out forwards;
    animation-delay:.2s;
    pointer-events: none;
}

@font-face {
    font-family: 'PerfectDOS';
    src: url('./assets/fonts/PerfectDOSVGA437.ttf') format('truetype');
    font-display: swap;
}

.crtBoot-text {
    font-family: "PerfectDOS", monospace;
    color: #00ff88;
    
    /* Setzt die Breite fest auf 1/3 des Fensters */
    width: 33.33vw; 
    
    /* Dynamische Schriftgröße, die sich der Fensterbreite anpasst */
    font-size: 2vw; 
    line-height: 1.3;
    
    text-shadow: 0 0 10px #00ff88;
    opacity: 0;
    animation: crtTextFadeIn 1.2s ease-out forwards;
    animation-delay: 1.4s;
    white-space: pre-wrap;
    text-align: left;
    
    /* Verhindert, dass ultralange Wörter das Layout sprengen */
    word-break: break-word; 
}

#typewriter::after {
    content:"█";
    margin-left:4px;
    animation:blink 0.17s steps(1) infinite;
    font-weight:bold;
    color:#00ff88;
}

.crtBoot-text.burnout {
    animation:crtBurnOut .8s ease-in forwards;
}

/* --- KEYFRAMES --- */
@keyframes crtFlash { 0%{opacity:0;}10%{opacity:1;}60%{opacity:.4;}100%{opacity:0;} }
@keyframes crtWarp { 0%{opacity:0;transform:scale(1.4);}40%{opacity:1;transform:scale(1.05);}100%{opacity:.2;transform:scale(1);} }
@keyframes crtTextFadeIn { 0%{opacity:0;filter:blur(6px);}100%{opacity:1;filter:blur(0);} }
@keyframes crtBurnOut { 0%{opacity:1;}50%{opacity:.4;}100%{opacity:0;} }
@keyframes crtFlicker { 0%{opacity:.85;}50%{opacity:.95;}100%{opacity:.8;} }
@keyframes blink { 0%{opacity:1;}50%{opacity:0;}100%{opacity:1;} }

#preloader { display:none; }

/* --- VISUALIZER STYLE --- */
#Visualizer { 
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%; 
    height: 120px; 
    display: block; 
    z-index: 20000; 
    pointer-events: none; 
}

/* --- PARALLAX STYLE --- */
.parallax-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    transform: scale(1.0) perspective(1000px) rotateX(0deg); 
    box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.8), 0 0 50px rgba(0, 0, 0, 1);
    will-change: transform;
    z-index: 1;
}

.layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    will-change: transform;
}

.layer img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scale(1.1); 
    filter: blur(0.3px) brightness(0.95); 
}

/* --- CRT EFFEKTE (PARALLAX) --- */
.phosphor-glow {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 9998;
    pointer-events: none;
    background: radial-gradient(circle, rgba(255, 150, 50, 0.08) 0%, rgba(0, 0, 0, 0.35) 100%);
    mix-blend-mode: color-dodge; 
}

.crt-aperture-grill {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 9999;
    pointer-events: none;
    background: 
        linear-gradient(90deg, rgba(255,255,255,0) 2px, rgba(0,0,0,0.25) 3px),
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%),
        linear-gradient(90deg, rgba(255,0,0,0.03), rgba(0,255,0,0.01), rgba(0,0,255,0.03));
    background-size: 3px 100%, 100% 4px, 6px 100%;
    opacity: 0.85;
    animation: crt-flicker 0.15s infinite;
}

.crt-roll {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 10000;
    opacity: 1;
}

.crt-roll::before {
    content: "";
    position: absolute;
    left: -5%;
    width: 110%;
    height: 260px;
    top: var(--crt-line);
    background: linear-gradient(
        to bottom,
        transparent 0,
        rgba(255, 255, 255, 0.015) 10%,
        rgba(255, 180, 40, 0.05) 22%,
        rgba(255, 190, 60, 0.12) 35%,
        rgba(255, 210, 120, 0.20) 50%,
        rgba(255, 190, 60, 0.12) 65%,
        rgba(255, 180, 40, 0.05) 78%,
        rgba(255, 255, 255, 0.015) 90%,
        transparent 0
    );
    filter: blur(22px);
    mix-blend-mode: color-dodge !important;
}

@keyframes crt-flicker {
    0% { opacity: 0.83; }
    50% { opacity: 0.87; }
    100% { opacity: 0.76; }
}
</style>
</head>
<body>

    <div id="crtBoot">
        <div class="crtBoot-flash"></div>
        <div class="crtBoot-warp"></div>
        <div class="crtBoot-inner">
            <div class="crtBoot-text"><span id="typewriter"></span></div>
        </div>
    </div>

    <div id="preloader"></div>

    <canvas id="Visualizer"></canvas>

    <div class="parallax-container" id="scene">
        <div class="layer" data-depth="0.02"><img src="assets/img_index/background.webp" alt="Background"></div>
        <div class="layer" data-depth="0.03"><img src="assets/img_index/ground_layer_0.webp" alt="Ground 0"></div>
        <div class="layer" data-depth="0.09"><img src="assets/img_index/logo.webp" alt="Logo"></div>
        <div class="layer" data-depth="0.03"><img src="assets/img_index/girl.webp" alt="Girl"></div>
        <div class="layer" data-depth="0.03"><img src="assets/img_index/anim.webp" alt=""></div>
        <div class="layer" data-depth="0.05"><img src="assets/img_index/ground_layer_1.webp" alt="Ground 1"></div>
    </div>

    <div class="crt-roll"></div>
    <div class="phosphor-glow"></div>
    <div class="crt-aperture-grill"></div>

<script type="module">
import { startPreloader } from "./assets/js/preloader.js";

const boot = document.getElementById("crtBoot");
const bootText = document.querySelector(".crtBoot-text");
const typewriterText = document.getElementById("typewriter");

let preloaderDone = false;
let minBootTimeDone = false;
let typewriterDone = false;
let postTypewriterDelayDone = false;
let readyToDismiss = false; 
let bootScreenActive = true; 

/* --- TYPEWRITER CONFIG --- */
const typewriterLines = [
    "> Initializing CRT System...",
    "> Loading assets...",
    "> Starting display driver...",
    "> Syncing phosphor grid...",
    "> Boot complete "
];

let twIndex = 0;
let charIndex = 0;
let typingSpeed = 50;

setTimeout(() => {
    typeWriter();
}, 2600);

function typeWriter() {
    const line = typewriterLines[twIndex];

    if (charIndex < line.length) {
        let output = "";
        for (let i = 0; i < twIndex; i++) {
            output += typewriterLines[i] + "\n";
        }
        output += line.substring(0, charIndex + 1);
        typewriterText.textContent = output;
        charIndex++;
        setTimeout(typeWriter, typingSpeed);
        return;
    }

    twIndex++;
    charIndex = 0;

    if (twIndex >= typewriterLines.length) {
        typewriterText.textContent = typewriterLines.join("\n");
        typewriterDone = true;

        setTimeout(() => {
            postTypewriterDelayDone = true;
            tryFinishBoot();
        }, 2500);
        return;
    }

    setTimeout(typeWriter, 200);
}

/* --- BOOT LOGIC --- */
setTimeout(() => {
    minBootTimeDone = true;
    tryFinishBoot();
}, 5000);

startPreloader();

document.addEventListener("preloaderComplete", () => {
    preloaderDone = true;
    tryFinishBoot();
});

function tryFinishBoot() {
    if (!preloaderDone || !minBootTimeDone || !typewriterDone || !postTypewriterDelayDone) return;

    if (!readyToDismiss) {
        typewriterText.textContent = typewriterLines.join("\n") + "\n\n> CLICK TO ENTER...";
        readyToDismiss = true;
    }
}

/* Failsafe */
setTimeout(() => {
    preloaderDone = true;
    tryFinishBoot();
}, 12000);

/* --- CLICK LOGIK: BOOT BEENDEN ODER WEITERLEITEN --- */
document.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('click', e => {
    e.preventDefault();
    
    if (bootScreenActive) {
        if (!readyToDismiss) return; 
        
        readyToDismiss = false; 
        bootScreenActive = false; 

        // Musik starten
        if (!player) {
            player = new BLKDTHAudioPlayer("assets/dat/data.99");
        } else if (player.ctx && player.ctx.state === 'suspended') {
            player.ctx.resume();
        }

        // Burnout Animation
        bootText.style.animation = "none";
        void bootText.offsetWidth; 
        bootText.style.animation = "";
        bootText.classList.add("burnout");

        setTimeout(() => {
            boot.style.transition = "opacity 0.6s ease-out";
            boot.style.opacity = "0";
            
            if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch((err) => {
                console.error(`Fehler beim Aktivieren des Vollbildmodus: ${err.message}`);
            });
        }

            setTimeout(() => {
                boot.style.display = "none"; 
            }, 700);
        }, 800);

        return;
    }

   // --- SMARTPHONE ERKENNUNG ---
   const isSmartphone =
        window.matchMedia("(pointer: coarse)").matches &&
        window.matchMedia("(max-width: 768px)").matches;

    if (isSmartphone) {
        window.location.href = "mobile.html";
    } else {
        // Ermittle den letzten Player aus dem LocalStorage
        const lastPlayer = localStorage.getItem("lastCyberPlayer");

        if (lastPlayer) {
            window.location.replace(lastPlayer);
        } else {
            window.location.replace("blackdeath_cp1_amber.html");
        }
    }
}); 


/* --- AUDIO PLAYER (STREAM & OPTIMIZED FOR NO-PRELOAD) --- */
class BLKDTHAudioPlayer {
    constructor(audioSrc) {
        this.audioSrc = audioSrc;
        this.ctx = null;
        this.audioElement = null;
        this.source = null;
        this.analyser = null;
        this.dataArray = null;
        this.loadAndPlay();
    }

    async loadAndPlay() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            
            this.audioElement = new Audio();
            this.audioElement.crossOrigin = "anonymous";
            this.audioElement.preload = "none"; // Absolutes Preload-Verbot für Streams
            this.audioElement.loop = true;
            this.audioElement.src = this.audioSrc;

            this.analyser = this.ctx.createAnalyser();
            this.analyser.fftSize = 512;                 
            this.analyser.smoothingTimeConstant = 0.88;  
            
            this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
            
            // Verbinde das HTML5-Audio-Element mit der Web Audio API Engine
            this.source = this.ctx.createMediaElementSource(this.audioElement);
            this.source.connect(this.analyser);
            this.analyser.connect(this.ctx.destination);
        }

        if (this.ctx.state === 'suspended') {
            await this.ctx.resume();
        }

        try {
            // Spielt den Stream erst exakt ab jetzt ab, ohne vorher Daten zu blockieren
            await this.audioElement.play();
            renderVisualizer(this);
        } catch (error) {
            console.error("Audio-Fehler beim Stream-Start:", error);
        }
    }
}

let player = null; 
const canvas = document.getElementById("Visualizer");
const ctx2 = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = 120; 
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

function renderVisualizer(playerInstance) {
    if (!playerInstance.analyser) return;

    playerInstance.analyser.getByteFrequencyData(playerInstance.dataArray);
    ctx2.clearRect(0, 0, canvas.width, canvas.height);

    const barWidth = 10;
    const barGap = 2;
    const segmentHeight = 4;
    const segmentGap = 2;

    const endCutoff = Math.floor(playerInstance.dataArray.length * 0.65);

    const centerX = canvas.width / 2;
    const numBarsPerSide = Math.floor(centerX / (barWidth + barGap));

    const gradient = ctx2.createLinearGradient(
        0,
        canvas.height,
        0,
        0
    );

    gradient.addColorStop(0, "rgba(0,255,0,0.9)");
    gradient.addColorStop(0.5, "rgba(255,255,0,0.9)");
    gradient.addColorStop(1, "rgba(255,0,0,0.9)");

    ctx2.fillStyle = gradient;

    for (let i = 0; i < numBarsPerSide; i++) {

        const dataIndex = Math.floor(
            (i / numBarsPerSide) * endCutoff
        );

        const v = playerInstance.dataArray[dataIndex] / 255;

        const maxBarHeight = canvas.height;
        const currentBarHeight = v * maxBarHeight;

        const numSegments = Math.floor(
            currentBarHeight / (segmentHeight + segmentGap)
        );

        const xRight = centerX + (i * (barWidth + barGap));
        const xLeft  = centerX - (i * (barWidth + barGap)) - barWidth;

        for (let j = 0; j < numSegments; j++) {

            const y =
                canvas.height -
                (j * (segmentHeight + segmentGap)) -
                segmentHeight;

            if (y >= 0) {

                ctx2.fillRect(
                    xRight,
                    y,
                    barWidth,
                    segmentHeight
                );

                ctx2.fillRect(
                    xLeft,
                    y,
                    barWidth,
                    segmentHeight
                );
            }
        }
    }

    const fadeOverlay = ctx2.createLinearGradient(
        0,
        0,
        0,
        canvas.height
    );

    fadeOverlay.addColorStop(0, "rgba(5,5,5,0.5)");
    fadeOverlay.addColorStop(1, "rgba(5,5,5,0.0)");

    ctx2.globalCompositeOperation = "source-atop";
    ctx2.fillStyle = fadeOverlay;
    ctx2.fillRect(0, 0, canvas.width, canvas.height);
    ctx2.globalCompositeOperation = "source-over";

    requestAnimationFrame(() => renderVisualizer(playerInstance));
}

/* --- PARALLAX & MOUSE LOGIC --- */
const scene = document.getElementById('scene');
const layers = document.querySelectorAll('.layer');

let targetX = 0, targetY = 0;
let currentX = 0, currentY = 0;
const easing = 0.08; 

let windowWidth = window.innerWidth;
let windowHeight = window.innerHeight;
let sceneCenter = windowHeight / 2;

window.addEventListener('resize', () => {
    windowWidth = window.innerWidth;
    windowHeight = window.innerHeight;
    sceneCenter = windowHeight / 2;
});

scene.addEventListener('mousemove', (e) => {
    targetX = (e.clientX / windowWidth) - 0.5;
    targetY = (e.clientY / windowHeight) - 0.5;
});

scene.addEventListener('mouseleave', () => {
    targetX = 0;
    targetY = 0;
});

function animate() {
    const t = performance.now() * 0.1;

    currentX += (targetX - currentX) * easing;
    currentY += (targetY - currentY) * easing;

    layers.forEach(layer => {
        const depth = parseFloat(layer.dataset.depth);
        const moveX = currentX * windowWidth * depth * 0.5;
        const moveY = currentY * windowHeight * depth * 0.5;
        layer.style.transform = `translate3d(${moveX}px, ${moveY}px, 0)`;
    });

    const linePos = (t % (windowHeight + 400)) - 300;
    document.documentElement.style.setProperty("--crt-line", `${linePos}px`);

    const distance = Math.abs(sceneCenter - linePos);

    if (distance < 250) {
        const strength = (250 - distance) / 250;
        const offset = (Math.random() - 0.5) * 2 * strength;
        scene.style.transform = `scale(1.0) translate3d(${offset}px, 0, 0) perspective(1000px) rotateX(0deg)`;
    } else {
        scene.style.transform = `scale(1.0) perspective(1000px) rotateX(0deg)`;
    }

    requestAnimationFrame(animate);
}

animate();
</script>
</body>
