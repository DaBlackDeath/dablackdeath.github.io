   GLOBAL (GitS Tonal Shift)

/* =========================================================
   THEME SWITCH (Taktisch angepasst)
========================================================= */

    letter-spacing: 1px;
}

.theme-switch a:hover {

    box-shadow: 0 0 10px rgba(0,255,102,0.3);
}

/* =========================================================
   STARFIELD BACKGROUND
========================================================= */

.cyber-player-controls {

.cyber-btn {

}

.cyber-btn:hover {

    border-color: #00ff66;
    color: #ffffff;
    box-shadow: 0 0 10px rgba(0,255,102,0.2);
}

/* =========================================================
   LOOP + SEEK
========================================================= */
.cyber-loop-label {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 8px;
    font-size: 0.75rem;
    color: #00ebd4;

}

.cyber-loop-label input {

}

.cyber-seek {

}

.cyber-seek::-webkit-slider-thumb {

/* =========================================================

========================================================= */
.cyber-playlist {

.cyber-track {

.cyber-track:hover {

.cyber-track.active {

/* =========================================================
   VISUALIZER
========================================================= */
#cyberVisualizer {
    width: 100%;
    height: 140px;
    background: rgba(2, 4, 6, 0.8);
    border: 1px solid rgba(0,255,102,0.2);

    box-shadow:
        0 0 15px rgba(0,255,102,0.05),
        inset 0 0 18px rgba(0,0,0,0.9);
}

.logo{
    opacity: 0.95;

    width:min(30vw, 30vh);
    z-index:10;

        drop-shadow(0 0 20px rgba(50, 224, 195, 0.7))
        drop-shadow(0 0 40px #6ee4ec)
        drop-shadow(0 0 60px #88e5f5);
}

@keyframes float{
    0%,100%{ transform: translate(-50%, -50%) translateY(0px); }
    50%{ transform: translate(-50%, -50%) translateY(-25px); }
}
</style>

<div class="theme-switch">

<canvas id="starfield"></canvas>

<div class="cyber-player-box">
    <div class="cyber-player-title">// AUDIO NETCONNECT: ACTIVE</div>

    <div class="cyber-player-controls">
        <button class="cyber-btn prev">⏮ PREV</button>
        <button class="cyber-btn play">▶ PLAY</button>
        <button class="cyber-btn pause">⏸ PAUSE</button>

    </div>

    <label class="cyber-loop-label">

    </label>

    <div class="cyber-playlist"></div>

    <canvas id="cyberVisualizer" width="800" height="140"></canvas>
</div>

<script>
/* =========================================================
   STARFIELD
========================================================= */
const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');

const numParticles = 150; 
const maxDistance = 120;  
const baseSpeed = 0.8;    
const particles = [];

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    particles.forEach(p => p.reset());
}

class Particle {
    constructor() { this.reset(); }
    reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * baseSpeed;
        this.vy = (Math.random() - 0.5) * baseSpeed;
        this.size = Math.random() * 2 + 1.5;
        this.hue = Math.random() > 0.5 ? 145 : 180; 
        this.twinkleSpeed = Math.random() * 0.02 + 0.005;
        this.twinkleOffset = Math.random() * Math.PI * 2;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
    }
    draw() {
        const twinkle = Math.sin(performance.now() * this.twinkleSpeed + this.twinkleOffset) * 0.3 + 0.7;
        ctx.fillStyle = `hsla(${this.hue}, 90%, 65%, ${twinkle})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawNetwork() {
    for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
            const p1 = particles[i];
            const p2 = particles[j];
            const dx = p1.x - p2.x;
            const dy = p1.y - p2.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < maxDistance) {
                const alpha = (1 - dist / maxDistance) * 0.4;
                ctx.strokeStyle = `hsla(${p1.hue}, 90%, 65%, ${alpha})`;
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
            }
        }
    }
}

for (let i = 0; i < numParticles; i++) particles.push(new Particle());
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function animateNetwork() {
    ctx.fillStyle = 'rgba(5, 7, 10, 0.4)'; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (let p of particles) p.update();
    drawNetwork();
    for (let p of particles) p.draw();
    requestAnimationFrame(animateNetwork);
}
animateNetwork();

/* =========================================================
   CYBERPUNK PLAYER (CP3 DARKTECH GitS MOD)
========================================================= */
class CyberPlaylistPlayer {
    constructor(root, playlist) {
        this.root = root;
        this.playlist = playlist;
        this.currentIndex = 0;

        this.ctx = null;
        this.sourceNode = null;
        this.analyser = null;
        this.dataArray = null;
        
        this.audioBuffer = null; 
        this.isPlaying = false;
        this.startTime = 0;      
        this.pauseTime = 0;      
        this.loop = true;
        this.isDragging = false;

        this.buildRefs();
        this.renderPlaylist();
        this.loadTrack(0, false);
    }

    buildRefs() {
        this.playBtn = this.root.querySelector(".play");
        this.pauseBtn = this.root.querySelector(".pause");
        this.stopBtn = this.root.querySelector(".stop");
        this.prevBtn = this.root.querySelector(".prev");
        this.nextBtn = this.root.querySelector(".next");
        this.seek = this.root.querySelector(".cyber-seek");
        this.loopToggle = this.root.querySelector(".loop");
        this.listBox = this.root.querySelector(".cyber-playlist");

        this.playBtn.onclick = () => this.play();
        this.pauseBtn.onclick = () => this.pause();
        this.stopBtn.onclick = () => this.stop();
        this.prevBtn.onclick = () => this.prevTrack();
        this.nextBtn.onclick = () => this.nextTrack();

        this.loopToggle.onchange = () => {
            this.loop = this.loopToggle.checked;
            if (this.sourceNode) {
                this.sourceNode.loop = this.loop;
            }
        };

        this.seek.oninput = () => { this.isDragging = true; };
        this.seek.onchange = () => {
            if (!this.audioBuffer) return;
            const targetTime = (this.seek.value / 100) * this.audioBuffer.duration;
            if (this.isPlaying) {
                this.stopSource();
                this.play(targetTime);
            } else {
                this.pauseTime = targetTime;
            }
            this.isDragging = false;
        };

        this.seek.onmouseup = () => { this.isDragging = false; };
        this.seek.ontouchend = () => { this.isDragging = false; };
        
        const updateProgress = () => {
            this.updateSeek();
            requestAnimationFrame(updateProgress);
        };
        requestAnimationFrame(updateProgress);
    }

    renderPlaylist() {
        this.listBox.innerHTML = "";
        this.playlist.forEach((track, i) => {
            const item = document.createElement("div");
            item.className = "cyber-track" + (i === this.currentIndex ? " active" : "");
            item.textContent = track.name;
            item.onclick = () => this.loadTrack(i, true);
            this.listBox.appendChild(item);
        });
    }

    highlightActive() {
        this.listBox.querySelectorAll(".cyber-track").forEach((el, i) => {
            const isActive = i === this.currentIndex;
            el.classList.toggle("active", isActive);
            if (isActive) {
                el.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }
        });
    }

    initAudioEngine() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.analyser = this.ctx.createAnalyser();
            this.analyser.fftSize = 128;
            this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
            this.analyser.connect(this.ctx.destination);
        }
    }

    async loadTrack(index, autoplay = false) {
        this.currentIndex = index;
        this.highlightActive();
        this.initAudioEngine();
        this.stopSource();
        
        this.audioBuffer = null;
        this.pauseTime = 0;
        this.seek.value = 0;

        if (this.playlist && this.playlist[index]) {
            try {
                const response = await fetch(this.playlist[index].src);
                const arrayBuffer = await response.arrayBuffer();
                this.audioBuffer = await this.ctx.decodeAudioData(arrayBuffer);
                
                if (autoplay) {
                    this.play();
                }
            } catch (e) {
                console.error("Fehler beim Dekodieren der Audiodatei:", e);
            }
        }
    }

    play(resumeTime = null) {
        this.initAudioEngine();
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }

        if (!this.audioBuffer || this.isPlaying) return;

        this.sourceNode = this.ctx.createBufferSource();
        this.sourceNode.buffer = this.audioBuffer;
        this.sourceNode.loop = this.loop;
        this.sourceNode.connect(this.analyser);

        const offset = resumeTime !== null ? resumeTime : this.pauseTime;
        this.sourceNode.start(0, offset);
        
        this.startTime = this.ctx.currentTime - offset;
        this.isPlaying = true;

        this.sourceNode.onended = () => {
            if (!this.sourceNode.loop && this.isPlaying && (this.ctx.currentTime - this.startTime >= this.audioBuffer.duration - 0.1)) {
                this.isPlaying = false;
                this.nextTrack();
            }
        };

        if (!this.visualizerActive) {
            this.visualizerActive = true;
            renderVisualizer(this);
        }
    }

    pause() {
        if (this.isPlaying) {
            this.pauseTime = this.ctx.currentTime - this.startTime;
            this.stopSource();
        }
    }

    stop() {
        this.pauseTime = 0;
        this.stopSource();
        this.seek.value = 0;
    }

    stopSource() {
        if (this.sourceNode) {
            try { this.sourceNode.stop(); } catch(e){}
            this.sourceNode.disconnect();
            this.sourceNode = null;
        }
        this.isPlaying = false;
    }

    nextTrack() {
        const nextIndex = (this.currentIndex + 1) % this.playlist.length;
        this.loadTrack(nextIndex, true);
    }

    prevTrack() {
        const prevIndex = (this.currentIndex - 1 + this.playlist.length) % this.playlist.length;
        this.loadTrack(prevIndex, true);
    }

    updateSeek() {
        if (this.isDragging || !this.isPlaying || !this.audioBuffer) return;

        let currentPosition = this.ctx.currentTime - this.startTime;
        if (this.loop) {
            currentPosition = currentPosition % this.audioBuffer.duration;
        }
        this.seek.value = (currentPosition / this.audioBuffer.duration) * 100;
    }
}


/* =========================================================
   VISUALIZER
========================================================= */
const vizCanvas = document.getElementById("cyberVisualizer");
const vizCtx = vizCanvas.getContext("2d");

function renderVisualizer(player) {
    if (!player || !player.analyser) return;

    player.analyser.getByteFrequencyData(player.dataArray);

    const w = vizCanvas.width;
    const h = vizCanvas.height;
    vizCtx.clearRect(0, 0, w, h);

    const barCount = player.dataArray.length * 0.75; 
    const barWidth = w / barCount;

    for (let i = 0; i < barCount; i++) {
        const v = player.dataArray[i] / 255;
        const barHeight = v * (h - 20);

        const x = i * barWidth;
        const y = h - barHeight;
        const t = i / barCount;

        let r, g, b;
        if (t < 0.5) {
            const k = t / 0.5; 
            r = 0;
            g = Math.floor(255 - (50 * k));       
            b = Math.floor(0 + (212 * k));        
        } else {
            const k = (t - 0.5) / 0.5; 
            r = 0;
            g = Math.floor(205 + (50 * k));       
            b = Math.floor(212 - (212 * k));      
        }

        const alpha = 0.3 + v * 0.7;
        vizCtx.fillStyle = `rgba(${r},${g},${b},${alpha})`;

        const radius = 1;
        const bw = barWidth * 0.85;
        const bx = x + (barWidth - bw) / 2;

        vizCtx.beginPath();
        vizCtx.moveTo(bx + radius, y);
        vizCtx.lineTo(bx + bw - radius, y);
        vizCtx.quadraticCurveTo(bx + bw, y, bx + bw, y + radius);
        vizCtx.lineTo(bx + bw, y + barHeight - radius);
        vizCtx.quadraticCurveTo(bx + bw, y + barHeight, bx + bw - radius, y + barHeight);
        vizCtx.lineTo(bx + radius, y + barHeight);
        vizCtx.quadraticCurveTo(bx, y + barHeight, bx, y + barHeight - radius);
        vizCtx.lineTo(bx, y + radius);
        vizCtx.quadraticCurveTo(bx, y, bx + radius, y);
        vizCtx.closePath();
        vizCtx.fill();
    }

    requestAnimationFrame(() => renderVisualizer(player));
}

/* =========================================================
   PLAYLIST + PLAYER INIT
========================================================= */
async function initPlayer() {
    try {
	localStorage.setItem("lastCyberPlayer", "blackdeath_cp3_darktech.html");
	window.history.replaceState({}, document.title, "/");
        const response = await fetch("assets/playlist.json");
        const playlist = await response.json();
        const playerRoot = document.querySelector(".cyber-player-box");
        const cyberPlayer = new CyberPlaylistPlayer(playerRoot, playlist);
    } catch (e) {
        console.error("Kritischer Fehler beim Initialisieren des Players:", e);
    }
}
initPlayer();
</script>
