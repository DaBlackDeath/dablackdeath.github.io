<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MERAL – KAWAII METAL PLAYER</title>
    <style>
        /* ============================================================
           GLOBAL & LAYOUT
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #09040d;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: #ffd6f3;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 0 10px;
        }

        /* ============================================================
           KAWAII BACKGROUND
           ============================================================ */
        #kawaii-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* ============================================================
           LOGO – dynamisch & automatisch skalierend
           ============================================================ */
        .logo-wrapper {
            position: relative;
            z-index: 20;
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            padding-top: 6px;
            padding-bottom: 4px;
            /* Höhe wird über das Bild bestimmt, aber wir geben ein max vor */
            min-height: 150px;
            max-height: 150px;
        }

        .logo {
            width: auto;
            height: 100%;
            max-height: 100%;
            /* maximale Höhe */
            min-height: 40px;
            /* minimale Höhe */
            object-fit: contain;
            animation: floatLogo 5s ease-in-out infinite;
            pointer-events: none;
            filter: drop-shadow(0 0 12px rgba(255, 30, 180, 0.5));
        }

        @keyframes floatLogo {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-4px);
            }
        }

        /* ============================================================
           PLAYER BOX – größer gemacht
           ============================================================ */
        .cyber-player-box {
            width: 100%;
            max-width: 420px;
            flex: 1;
            /* nimmt den restlichen Platz ein */
            min-height: 0;
            background:
                linear-gradient(145deg, rgba(28, 10, 32, .94), rgba(8, 5, 14, .96)),
                repeating-linear-gradient(135deg, rgba(255, 35, 170, .05) 0 2px, transparent 2px 9px);
            border: 2px solid #ff4fc3;
            border-radius: 24px 24px 18px 18px;
            padding: 14px 16px 16px 16px;
            box-shadow:
                0 0 0 2px rgba(255, 255, 255, .08),
                0 0 18px rgba(255, 20, 170, .55),
                0 0 45px rgba(255, 20, 170, .25),
                inset 0 0 25px rgba(255, 20, 170, .10);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: pan-y;
            margin-bottom: 10px;
        }

        /* Titel – kleiner & dezent */
        .cyber-player-title {
            text-align: center;
            font-size: 0.85rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #ff69cf;
            font-weight: 800;
            text-transform: uppercase;
            text-shadow:
                2px 2px 0 #09040d,
                0 0 8px #ff39c7,
                0 0 20px rgba(255, 39, 193, .8);
            flex-shrink: 0;
        }

        /* ============================================================
           CONTROLS – kompakt & gut tippbar
           ============================================================ */
        .cyber-player-controls {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .cyber-btn {
            background: linear-gradient(135deg, #ff4fc3, #ff91df 45%, #b8b0ff);
            border: 2px solid #ffd9f5;
            flex: 1;
            min-height: 48px;
            max-height: 52px;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 4px 0 #6f174f, 0 0 14px rgba(255, 40, 190, 0.55);
            transition: 0.08s;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .cyber-btn svg {
            width: 22px;
            height: 22px;
            fill: #2a0824;
            transition: transform 0.08s;
        }

        .cyber-btn:active {
            transform: scale(0.94);
            box-shadow: 0 2px 0 #6f174f, 0 0 8px rgba(255, 30, 190, 0.8);
        }

        /* ============================================================
           LOOP & SEEK
           ============================================================ */
        .cyber-loop-label {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #ffb9e8;
            flex-shrink: 0;
        }

        .cyber-loop-label input {
            accent-color: #ffd6f3;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .cyber-seek {
            width: 100%;
            height: 5px;
            border-radius: 999px;
            background: linear-gradient(90deg, #ff299f, #ff62d2, #b99cff, #ff299f);
            margin-bottom: 8px;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
            flex-shrink: 0;
        }

        .cyber-seek::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ff63d0;
            border: 2px solid #fff;
            box-shadow: 0 0 12px #ff2fbc, 0 0 22px rgba(255, 47, 188, .7);
        }

        .cyber-seek::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ff63d0;
            border: 2px solid #fff;
            box-shadow: 0 0 12px #ff2fbc;
        }

        /* ============================================================
           PLAYLIST – fein & kompakt
           ============================================================ */
        .cyber-playlist {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            text-align: center;
            margin-bottom: 6px;
            scrollbar-width: thin;
            scrollbar-color: #ff3fc4 rgba(255, 255, 255, .06);
            padding-right: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .cyber-playlist::-webkit-scrollbar {
            width: 4px;
        }
        .cyber-playlist::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, .04);
            border-radius: 10px;
        }
        .cyber-playlist::-webkit-scrollbar-thumb {
            background-color: #ff3fc4;
            border-radius: 10px;
        }

        .cyber-track {
            padding: 6px 8px;
            margin-bottom: 4px;
            border-radius: 10px;
            background: linear-gradient(90deg, rgba(255, 35, 180, .10), rgba(255, 255, 255, .025));
            border: 1px solid rgba(255, 75, 202, .30);
            cursor: pointer;
            color: #ffd9f5;
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 0.3px;
            transition: 0.12s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cyber-track:active {
            transform: scale(0.97);
        }

        .cyber-track.active {
            background: linear-gradient(90deg, #ff299f, #ff62d2, #b99cff, #ff299f);
            color: #fff;
            border-color: #ffd6f3;
            box-shadow: 0 0 12px #ffc8e8, 0 0 18px #ffb7d5;
            font-weight: 700;
        }

        /* ============================================================
           VISUALIZER
           ============================================================ */
        #cyberVisualizer {
            width: 100%;
            height: 48px;
            flex-shrink: 0;
            background: rgba(68, 3, 63, 0.5);
            border: 1.5px solid rgba(255, 180, 220, .35);
            border-radius: 14px;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, .08);
            display: block;
        }

        /* ============================================================
           DEKORATIVE OVERLAYS
           ============================================================ */
        .cyber-player-box::before {
            content: "✦ ♡ ✦";
            position: absolute;
            top: 4px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255, 105, 210, .35);
            font-size: 9px;
            letter-spacing: 6px;
            pointer-events: none;
        }

        .cyber-player-box::after {
            content: "♥";
            position: absolute;
            right: 12px;
            top: 6px;
            color: #ff4fc3;
            text-shadow: 0 0 10px #ff4fc3;
            font-size: 11px;
            pointer-events: none;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 400px) {
            .cyber-player-box {
                padding: 10px 12px 12px 12px;
                border-radius: 18px 18px 14px 14px;
            }

            .logo-wrapper {
                min-height: 40px;
                max-height: 70px;
            }

            .logo {
                max-height: 55px;
                min-height: 30px;
            }

            .cyber-player-title {
                font-size: 0.7rem;
                letter-spacing: 1px;
                margin-bottom: 6px;
            }

            .cyber-btn {
                min-height: 40px;
                min-width: 40px;
            }
            .cyber-btn svg {
                width: 18px;
                height: 18px;
            }

            .cyber-track {
                font-size: 0.65rem;
                padding: 5px 6px;
            }

            #cyberVisualizer {
                height: 38px;
            }

            .cyber-seek {
                height: 4px;
            }
            .cyber-seek::-webkit-slider-thumb {
                width: 16px;
                height: 16px;
            }
        }

        /* ============================================================
           BEI SEHR KLEINEN HÖHEN
           ============================================================ */
        @media (max-height: 640px) {
            .logo-wrapper {
                min-height: 32px;
                max-height: 55px;
                padding-top: 2px;
            }
            .logo {
                max-height: 42px;
                min-height: 24px;
            }
            .cyber-player-box {
                padding: 8px 10px 10px 10px;
            }
            .cyber-player-title {
                font-size: 0.6rem;
                margin-bottom: 4px;
            }
            .cyber-btn {
                min-height: 34px;
            }
            .cyber-btn svg {
                width: 16px;
                height: 16px;
            }
            .cyber-loop-label {
                font-size: 0.6rem;
                margin-bottom: 2px;
            }
            .cyber-track {
                font-size: 0.6rem;
                padding: 4px 6px;
            }
            #cyberVisualizer {
                height: 32px;
            }
        }

        /* Landscape-Blocker */
        @media (orientation: landscape) and (max-height: 500px) {
            .cyber-player-box::after {
                content: "↻ bitte drehen";
                position: absolute;
                bottom: 10px;
                left: 0;
                right: 0;
                text-align: center;
                font-size: 11px;
                color: rgba(255, 150, 220, 0.6);
                letter-spacing: 1px;
                background: rgba(0, 0, 0, 0.4);
                padding: 4px 0;
                border-radius: 20px;
                width: 80%;
                margin: 0 auto;
                pointer-events: none;
            }
        }
    </style>
</head>
<body>

    <canvas id="kawaii-bg"></canvas>

    <!-- Logo mit flexibler Höhe -->
    <div class="logo-wrapper">
        <img class="logo" src="assets/img_player/meral_logo.webp" alt="MERAL" />
    </div>

    <div class="cyber-player-box">
        <div class="cyber-player-title">♡ MERAL // KAWAII METAL ♡</div>

        <div class="cyber-player-controls">
            <button class="cyber-btn prev" aria-label="Zurück">
                <svg viewBox="0 0 24 24"><path d="M11.5 12l6.5-5.5c.5-.4.5 1 .5 1.5v8c0 .5 0 1.9-.5 1.5L11.5 12zm-7 0L11 6.5c.5-.4.5 1 .5 1.5v8c0 .5 0 1.9-.5 1.5L4.5 12z"/></svg>
            </button>
            <button class="cyber-btn play" aria-label="Abspielen">
                <svg viewBox="0 0 24 24"><path d="M7.5 5.3c0-.8.9-1.3 1.6-.8l10.2 6.7c.6.4.6 1.3 0 1.7L9.1 19.5c-.7.5-1.6 0-1.6-.8V5.3z"/></svg>
            </button>
            <button class="cyber-btn pause" aria-label="Pause">
                <svg viewBox="0 0 24 24"><rect x="5.5" y="4.5" width="4" height="15" rx="2"/><rect x="14.5" y="4.5" width="4" height="15" rx="2"/></svg>
            </button>
            <button class="cyber-btn stop" aria-label="Stopp">
                <svg viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15" rx="4"/></svg>
            </button>
            <button class="cyber-btn next" aria-label="Weiter">
                <svg viewBox="0 0 24 24"><path d="M12.5 12L6 6.5c-.5-.4-.5 1-.5 1.5v8c0 .5 0 1.9.5 1.5l6.5-5.5zm7 0l-6.5-5.5c-.5-.4-.5 1-.5 1.5v8c0 .5 0 1.9.5 1.5l6.5-5.5z"/></svg>
            </button>
        </div>

        <label class="cyber-loop-label">
            <input type="checkbox" class="loop" checked />
            LOOP
        </label>

        <input type="range" class="cyber-seek" value="0" min="0" max="100" step="0.1" />

        <div class="cyber-playlist"></div>

        <canvas id="cyberVisualizer" width="400" height="80"></canvas>
    </div>

    <script>
        /* ============================================================
           AUDIO LOGIC
           ============================================================ */
        class CyberPlaylistPlayer {
            constructor(root, playlist) {
                this.root = root;
                this.playlist = playlist;
                this.currentIndex = 0;
                this.audio = new Audio();
                this.audio.crossOrigin = "anonymous";
                this.ctx = null;
                this.sourceNode = null;
                this.analyser = null;
                this.dataArray = null;
                this.loop = true;
                this.isDragging = false;
                this.visualizerActive = false;

                this.buildRefs();
                this.renderPlaylist();
                this.loadTrack(0, false);
            }

            buildRefs() {
                this.playBtn = this.root.querySelector(".play");
                this.pauseBtn = this.root.querySelector(".pause");
                this.stopBtn = this.root.querySelector(".stop");
                this.prevBtn = this.root.querySelector(".prev");
                this.nextBtn = this.root.querySelector(".next");
                this.seek = this.root.querySelector(".cyber-seek");
                this.loopToggle = this.root.querySelector(".loop");
                this.listBox = this.root.querySelector(".cyber-playlist");

                this.playBtn.onclick = () => this.play();
                this.pauseBtn.onclick = () => this.pause();
                this.stopBtn.onclick = () => this.stop();
                this.prevBtn.onclick = () => this.prevTrack();
                this.nextBtn.onclick = () => this.nextTrack();

                this.loopToggle.onchange = () => {
                    this.loop = this.loopToggle.checked;
                    this.audio.loop = this.loop;
                };

                this.seek.oninput = () => { this.isDragging = true; };
                this.seek.onchange = () => {
                    if (isNaN(this.audio.duration)) return;
                    this.audio.currentTime = (this.seek.value / 100) * this.audio.duration;
                    this.isDragging = false;
                };
                this.seek.onmouseup = () => { this.isDragging = false; };
                this.seek.ontouchend = () => { this.isDragging = false; };

                this.audio.ontimeupdate = () => this.updateSeek();
                this.audio.onended = () => {
                    if (!this.loop) this.nextTrack();
                };
            }

            renderPlaylist() {
                this.listBox.innerHTML = "";
                this.playlist.forEach((track, i) => {
                    const item = document.createElement("div");
                    item.className = "cyber-track" + (i === this.currentIndex ? " active" : "");
                    item.textContent = track.name;
                    item.onclick = () => this.loadTrack(i, true);
                    this.listBox.appendChild(item);
                });
            }

            highlightActive() {
                this.listBox.querySelectorAll(".cyber-track").forEach((el, i) => {
                    const isActive = i === this.currentIndex;
                    el.classList.toggle("active", isActive);
                    if (isActive) {
                        el.scrollIntoView({ behavior: "smooth", block: "nearest" });
                    }
                });
            }

            initAudioEngine() {
                if (!this.ctx) {
                    this.ctx = new(window.AudioContext || window.webkitAudioContext)();
                    this.analyser = this.ctx.createAnalyser();
                    this.analyser.fftSize = 128;
                    this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                    this.sourceNode = this.ctx.createMediaElementSource(this.audio);
                    this.sourceNode.connect(this.analyser);
                    this.analyser.connect(this.ctx.destination);
                }
            }

            loadTrack(index, autoplay = false) {
                this.currentIndex = index;
                this.highlightActive();
                this.audio.src = this.playlist[index].src;
                this.audio.loop = this.loop;
                this.seek.value = 0;
                if (autoplay) this.play();
            }

            play() {
                this.initAudioEngine();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                this.audio.play().catch(e => console.error("Streaming-Fehler:", e));
                if (!this.visualizerActive) {
                    this.visualizerActive = true;
                    renderVisualizer(this);
                }
            }

            pause() { this.audio.pause(); }

            stop() {
                this.audio.pause();
                this.audio.currentTime = 0;
                this.seek.value = 0;
            }

            nextTrack() {
                const nextIndex = (this.currentIndex + 1) % this.playlist.length;
                this.loadTrack(nextIndex, true);
            }

            prevTrack() {
                const prevIndex = (this.currentIndex - 1 + this.playlist.length) % this.playlist.length;
                this.loadTrack(prevIndex, true);
            }

            updateSeek() {
                if (this.isDragging || isNaN(this.audio.duration) || this.audio.duration === 0) return;
                this.seek.value = (this.audio.currentTime / this.audio.duration) * 100;
            }
        }

        /* ============================================================
           VISUALIZER
           ============================================================ */
        const vizCanvas = document.getElementById("cyberVisualizer");
        const vizCtx = vizCanvas.getContext("2d");

        function renderVisualizer(player) {
            if (!player || !player.analyser) return;

            if (player.audio && !player.audio.paused) {
                player.analyser.getByteFrequencyData(player.dataArray);
            } else if (player.dataArray) {
                for (let i = 0; i < player.dataArray.length; i++) {
                    player.dataArray[i] = Math.floor(player.dataArray[i] * 0.85);
                }
            }

            const w = vizCanvas.width;
            const h = vizCanvas.height;
            vizCtx.clearRect(0, 0, w, h);

            if (!player.dataArray) {
                requestAnimationFrame(() => renderVisualizer(player));
                return;
            }

            const barCount = player.dataArray.length * 0.8;
            const barWidth = w / barCount;

            for (let i = 0; i < barCount; i++) {
                const v = player.dataArray[i] / 255;
                const barHeight = v * h;
                const x = i * barWidth;
                const y = h - barHeight;
                const t = i / barCount;

                let r, g, b;
                if (t < 0.33) {
                    const k = t / 0.33;
                    r = 255;
                    g = Math.floor(35 + 80 * k);
                    b = Math.floor(170 + 55 * k);
                } else if (t < 0.66) {
                    const k = (t - 0.33) / 0.33;
                    r = 255;
                    g = Math.floor(115 + 90 * k);
                    b = Math.floor(225 + 25 * k);
                } else {
                    const k = (t - 0.66) / 0.34;
                    r = Math.floor(255 - 70 * k);
                    g = Math.floor(205 - 150 * k);
                    b = Math.floor(250 - 20 * k);
                }

                vizCtx.fillStyle = `rgba(${r},${g},${b},${0.4 + v * 0.6})`;
                const radius = 3;
                const bw = barWidth * 0.75;
                const bx = x + (barWidth - bw) / 2;

                if (barHeight > radius * 2) {
                    vizCtx.beginPath();
                    vizCtx.moveTo(bx + radius, y);
                    vizCtx.lineTo(bx + bw - radius, y);
                    vizCtx.quadraticCurveTo(bx + bw, y, bx + bw, y + radius);
                    vizCtx.lineTo(bx + bw, y + barHeight);
                    vizCtx.lineTo(bx, y + barHeight);
                    vizCtx.lineTo(bx, y + radius);
                    vizCtx.quadraticCurveTo(bx, y, bx + radius, y);
                    vizCtx.closePath();
                    vizCtx.fill();
                } else if (barHeight > 0) {
                    vizCtx.fillRect(bx, y, bw, barHeight);
                }
            }

            requestAnimationFrame(() => renderVisualizer(player));
        }

        /* ============================================================
           ANIMATED BACKGROUND
           ============================================================ */
        const bgCanvas = document.getElementById("kawaii-bg");
        const bgCtx = bgCanvas.getContext("2d");

        bgCanvas.width = window.innerWidth;
        bgCanvas.height = window.innerHeight;

        const kawaiiSprites = [
            { emoji: "🖤", size: 24 }, { emoji: "💖", size: 24 }, { emoji: "🩷", size: 24 },
            { emoji: "⚡", size: 22 }, { emoji: "★", size: 20 }, { emoji: "✦", size: 22 },
            { emoji: "🎀", size: 23 }, { emoji: "🐾", size: 22 }, { emoji: "🦊", size: 22 },
            { emoji: "🌸", size: 22 }, { emoji: "⛓", size: 22 }, { emoji: "♥", size: 22 }
        ];

        function createParticle(isInitial = false) {
            return {
                x: Math.random() * bgCanvas.width,
                y: isInitial ? Math.random() * bgCanvas.height : bgCanvas.height + 40,
                speed: 0.4 + Math.random() * 0.8,
                sprite: kawaiiSprites[Math.floor(Math.random() * kawaiiSprites.length)],
                opacity: 0.4 + Math.random() * 0.5,
                wobble: Math.random() * Math.PI * 2,
                wobbleSpeed: 0.01 + Math.random() * 0.02
            };
        }

        const particles = Array.from({ length: 35 }, () => createParticle(true));

        function resizeBg() {
            const oldW = bgCanvas.width,
                oldH = bgCanvas.height;
            const newW = window.innerWidth,
                newH = window.innerHeight;
            bgCanvas.width = newW;
            bgCanvas.height = newH;
            particles.forEach(p => {
                p.x = (p.x / oldW) * newW;
                p.y = (p.y / oldH) * newH;
            });
        }
        window.addEventListener("resize", resizeBg);

        function drawBackground() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            bgCtx.textBaseline = "middle";
            bgCtx.textAlign = "center";

            particles.forEach(p => {
                bgCtx.globalAlpha = p.opacity;
                bgCtx.font = `${p.sprite.size}px sans-serif`;
                const xFinal = p.x + Math.sin(p.wobble) * 15;
                bgCtx.fillText(p.sprite.emoji, xFinal, p.y);
                p.y -= p.speed;
                p.wobble += p.wobbleSpeed;
                if (p.y < -40) {
                    Object.assign(p, createParticle(false));
                }
            });

            bgCtx.globalAlpha = 1.0;
            requestAnimationFrame(drawBackground);
        }
        drawBackground();

        /* ============================================================
           INIT PLAYER
           ============================================================ */
        async function initPlayer() {
            try {
                const response = await fetch("assets/playlist.json");
                const playlist = await response.json();
                const playerRoot = document.querySelector(".cyber-player-box");
                window.cyberPlayer = new CyberPlaylistPlayer(playerRoot, playlist);
                renderVisualizer(window.cyberPlayer);
            } catch (e) {
                console.error("Fehler beim Laden der Playlist:", e);
                const fallbackPlaylist = [{ name: "assets/playlist.json fehlt!", src: "" }];
                const playerRoot = document.querySelector(".cyber-player-box");
                window.cyberPlayer = new CyberPlaylistPlayer(playerRoot, fallbackPlaylist);
                renderVisualizer(window.cyberPlayer);
            }
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initPlayer);
        } else {
            initPlayer();
        }
    </script>

</body>
</html>
