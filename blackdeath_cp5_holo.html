<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>BLACKDEATH – CP5 HOLOGRAM</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>
/* =========================================================
   GLOBAL
========================================================= */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: #000;
    font-family: 'Orbitron', sans-serif;
    overflow: hidden;
    color: #00fff0;
    scrollbar-color: rgba(46, 235, 203, 0.747) rgba(1, 77, 60, 0.5);
}

/* =========================================================
   THEME SWITCH (oben rechts)
========================================================= */
.theme-switch {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    gap: 10px;
    z-index: 9999;
}

.theme-switch a {
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 0.75rem;
    text-decoration: none;
    font-weight: 700;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(0,255,255,0.4);
    color: #00fff0;
    backdrop-filter: blur(6px);
    transition: 0.15s;
}

.theme-switch a:hover {
    background: rgba(0,255,255,0.2);
    box-shadow: 0 0 10px rgba(0,255,255,0.6);
}

/* =========================================================
   STARFIELD BACKGROUND
========================================================= */
#starfield {
    position: fixed;
    inset: 0;
    z-index: -1;
}

/* =========================================================
   TITLE (HOLOGRAM)
========================================================= */
.title {
    position: fixed;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 3.5rem;
    letter-spacing: 10px;
    color: #00fff0;
    text-shadow:
        0 0 10px #00fff0,
        0 0 20px #00aaff,
        0 0 40px #a066ff;
}

/* =========================================================
   PLAYER BOX (HOLOGRAM PANEL)
========================================================= */
.cyber-player-box {
    position: fixed;
    top: calc(35% + 80px);
    left: 50%;
    transform: translateX(-50%);
    width: 50%;
    min-width: 500px;
    max-width: 900px;

    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(0,255,255,0.35);
    border-radius: 14px;
    padding: 16px 20px 12px 20px;

    box-shadow:
        0 0 25px rgba(0,255,255,0.25),
        inset 0 0 20px rgba(0,0,0,0.8);
    backdrop-filter: blur(14px) brightness(1.3);
}

.cyber-player-title {
    text-align: center;
    font-size: 1rem;
    letter-spacing: 4px;
    margin-bottom: 10px;
    color: #00fff0;
    text-shadow:
        0 0 10px #00fff0,
        0 0 20px #a066ff;
}

/* =========================================================
   BUTTONS (HOLO PANELS)
========================================================= */
.cyber-player-controls {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 10px;
}

.cyber-btn {
    background: rgba(0,255,255,0.1);
    color: #00fff0;
    border: 1px solid rgba(0,255,255,0.4);
    padding: 6px 14px;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
    text-shadow: 0 0 6px #00fff0;
    box-shadow:
        0 0 10px rgba(0,255,255,0.4),
        inset 0 0 10px rgba(0,0,0,0.6);
    transition: 0.15s;
}

.cyber-btn:hover {
    background: rgba(0,255,255,0.2);
    box-shadow:
        0 0 14px rgba(0,255,255,1),
        0 0 22px rgba(160,102,255,0.8);
}

/* =========================================================
   LOOP + SEEK
========================================================= */
.cyber-loop-label {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 6px;
    font-size: 0.8rem;
    color: #a0eaff;
}

.cyber-loop-label input {
    accent-color: #00fff0;
}

.cyber-seek {
    width: 100%;
    height: 4px;
    border-radius: 999px;
    background: linear-gradient(90deg, #00fff0, #a066ff, #ffffff);
    margin-bottom: 10px;
    -webkit-appearance: none;
}

.cyber-seek::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #ffffff;
    border: 2px solid #00fff0;
    box-shadow: 0 0 10px #00fff0;
}

/* =========================================================
   PLAYLIST
========================================================= */
.cyber-playlist {
    text-align: center;
    max-height: 150px;
    overflow-y: auto;
}

.cyber-track {
    padding: 6px 8px;
    margin-bottom: 4px;
    border-radius: 8px;
    background: rgba(0,255,255,0.05);
    border: 1px solid rgba(0,255,255,0.2);
    cursor: pointer;
    transition: 0.15s;
    color: #a0eaff;
}

.cyber-track:hover {
    background: rgba(0,255,255,0.15);
}

.cyber-track.active {
    background: rgba(0,255,255,0.35);
    color: #00fff0;
    border-color: #00fff0;
    box-shadow: 0 0 12px #00fff0;
}

/* =========================================================
   VISUALIZER (HOLOGRAM SPECTRUM)
========================================================= */
#cyberVisualizer {
    width: 100%;
    height: 140px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(0,255,255,0.35);
    border-radius: 10px;
    margin-top: 10px;
    box-shadow:
        0 0 18px rgba(0,255,255,0.35),
        inset 0 0 18px rgba(0,0,0,0.9);
}

.logo{
    opacity: 0.95;
    position: fixed;
    left: 50%;
    top: 23%;
    transform: translate(-50%, -50%);
    width: min(75vw, 75vh);
    z-index: 10;
    animation: float 5s ease-in-out infinite;
    filter:
        drop-shadow(0 0 20px rgba(50, 224, 195, 0.7))
        drop-shadow(0 0 40px #6ee4ec)
        drop-shadow(0 0 60px #88e5f5);
}

@keyframes float{
    0%,100%{
        transform:
            translate(-50%, -50%)
            translateY(0px);
    }
    50%{
        transform:
            translate(-50%, -50%)
            translateY(-25px);
    }
}
</style>
</head>
<body>

<div class="theme-switch">
    <a href="blackdeath_cp1_amber.html">AMBER</a>
    <a href="blackdeath_cp2_synthwave.html">SYNTHWAVE</a>
    <a href="blackdeath_cp3_darktech.html">DARKTECH</a>
    <a href="blackdeath_cp4_kawaii.html">KAWAII</a>
    <a href="blackdeath_cp5_holo.html">HOLO</a>
</div>

<canvas id="starfield"></canvas>

<img
    class="logo"
    src="assets/img_player/holoui_logo.webp"
    alt="Logo"
>

<div class="cyber-player-box">
    <div class="cyber-player-title">AUDIO NODE // HOLOGRAM MODE</div>

    <div class="cyber-player-controls">
        <button class="cyber-btn prev">⏮</button>
        <button class="cyber-btn play">▶</button>
        <button class="cyber-btn pause">⏸</button>
        <button class="cyber-btn stop">⏹</button>
        <button class="cyber-btn next">⏭</button>
    </div>

    <label class="cyber-loop-label">
        <input type="checkbox" class="loop" checked>
        LOOP ENABLED
    </label>

    <input type="range" class="cyber-seek" value="0" min="0" max="100" step="0.1">

    <div class="cyber-playlist"></div>

    <canvas id="cyberVisualizer" width="800" height="140"></canvas>
</div>

<script>
/* =========================================================
   STARFIELD
========================================================= */
const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');

const numStars = 900;
const speed = 5;
const stars = [];

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    stars.forEach(star => {
        star.x = (Math.random() - 0.5) * canvas.width;
        star.y = (Math.random() - 0.5) * canvas.height;
        star.z = Math.random() * canvas.width;
        star.pz = star.z;
    });
}

class Star {
    constructor() { this.reset(); }

    reset() {
        this.x = (Math.random() - 0.5) * canvas.width;
        this.y = (Math.random() - 0.5) * canvas.height;
        this.z = Math.random() * canvas.width;
        this.pz = this.z;
        this.color = ["#00fff0", "#a066ff", "#ffffff"][Math.floor(Math.random()*3)];
        this.twinkleSpeed = Math.random() * 0.02 + 0.005;
        this.twinkleOffset = Math.random() * Math.PI * 2;
    }

    update() {
        this.pz = this.z;
        this.z -= speed;
        if (this.z <= 1) {
            this.reset();
            this.z = canvas.width;
            this.pz = this.z;
        }
    }

    draw() {
        const k = 960 / this.z;
        const px = this.x * k + canvas.width / 2;
        const py = this.y * k + canvas.height / 2;
        const pk = 960 / this.pz;
        const ppx = this.x * pk + canvas.width / 2;
        const ppy = this.y * pk + canvas.height / 2;

        if (px < 0 || px > canvas.width || py < 0 || py > canvas.height) return;

        const size = (1 - this.z / canvas.width) * 3 + 0.5;
        const twinkle = Math.sin(performance.now() * this.twinkleSpeed + this.twinkleOffset) * 0.5 + 0.5;
        const alpha = 0.4 + twinkle * 0.6;

        ctx.strokeStyle = this.color;
        ctx.fillStyle = this.color;

        ctx.beginPath();
        ctx.moveTo(ppx, ppy);
        ctx.lineTo(px, py);
        ctx.lineWidth = size * 0.4;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(px, py, size, 0, Math.PI * 2);
        ctx.fill();
    }
}

for (let i = 0; i < numStars; i++) stars.push(new Star());
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function animateStarfield() {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (let s of stars) {
        s.update();
        s.draw();
    }
    requestAnimationFrame(animateStarfield);
}
animateStarfield();

/* =========================================================
   CYBERPUNK PLAYER (HOLOGRAM)
========================================================= */
class CyberPlaylistPlayer {
    constructor(root, playlist) {
        this.root = root;
        this.playlist = playlist;
        this.currentIndex = 0;

        this.ctx = null;
        this.source = null;
        this.audioCache = {};
        
        this.analyser = null;
        this.dataArray = null;

        this.startTime = 0;
        this.pauseTime = 0;
        this.loop = true;

        this.buildRefs();
        this.loadTrack(0);
    }

    buildRefs() {
        this.playBtn   = this.root.querySelector(".play");
        this.pauseBtn  = this.root.querySelector(".pause");
        this.stopBtn   = this.root.querySelector(".stop");
        this.prevBtn   = this.root.querySelector(".prev");
        this.nextBtn   = this.root.querySelector(".next");
        this.seek      = this.root.querySelector(".cyber-seek");
        this.loopToggle= this.root.querySelector(".loop");
        this.listBox   = this.root.querySelector(".cyber-playlist");

        this.playBtn.onclick  = () => this.play();
        this.pauseBtn.onclick = () => this.pause();
        this.stopBtn.onclick  = () => this.stop();
        this.prevBtn.onclick  = () => this.prevTrack();
        this.nextBtn.onclick  = () => this.nextTrack();

        this.loopToggle.onchange = () => {
            this.loop = this.loopToggle.checked;
            if (this.source) {
                this.source.loop = this.loop;
            }
        };

        this.seek.oninput = () => {
            const buffer = this.audioCache[this.currentIndex];
            if (!buffer) return;
            this.pauseTime = (this.seek.value / 100) * buffer.duration;
        };

        this.seek.onchange = () => {
            if (!this.audioCache[this.currentIndex]) return;
            if (this.source) {
                this.source.onended = null;
                try { this.source.stop(0); } catch(e) {}
                this.source.disconnect();
                this.source = null;
            }
            this.play();
        };

        this.renderPlaylist();
    }

    renderPlaylist() {
        this.listBox.innerHTML = "";
        this.playlist.forEach((track, i) => {
            const item = document.createElement("div");
            item.className = "cyber-track" + (i === this.currentIndex ? " active" : "");
            item.textContent = track.name;
            item.onclick = () => this.loadTrack(i, true);
            this.listBox.appendChild(item);
        });
    }

    highlightActive(){
        this.listBox.querySelectorAll(".cyber-track").forEach((el, i) => {
            const isActive = i === this.currentIndex;
            el.classList.toggle("active", isActive);
            if (isActive) {
                el.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }
        });
    }

    async init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    async preloadTrack(index) {
            await this.init();

    const jobs = this.playlist.map(async (item, i) => {
        if (this.audioCache[i]) return;

        try {
            const data = await fetch(item.src).then(r => r.arrayBuffer());
            const decoded = await this.ctx.decodeAudioData(data);
            this.audioCache[i] = decoded;
        } catch (e) {
            console.error("Fehler:", item.src, e);
        }
    });

    await Promise.all(jobs);
    console.log("Alle Tracks vorgeladen.");
    }

    async loadTrack(index, autoplay = false) {
        this.stop();
        this.currentIndex = index;
        this.highlightActive();
        await this.init();

        this.pauseTime = 0;
        this.seek.value = 0;

        if (!this.audioCache[index]) {
            await this.preloadTrack(index);
        }

        if (autoplay) {
            this.play();
        }

        const nextIndex = (index + 1) % this.playlist.length;
        const prevIndex = (index - 1 + this.playlist.length) % this.playlist.length;
        this.preloadTrack(nextIndex);
        this.preloadTrack(prevIndex);
    }

    play() {
        const buffer = this.audioCache[this.currentIndex];
        if (!buffer) return;

        if (this.source) {
            this.source.onended = null;
            try { this.source.stop(0); } catch(e) {}
            this.source.disconnect();
            this.source = null;
        }

        this.source = this.ctx.createBufferSource();
        this.source.buffer = buffer;
        this.source.loop = this.loop;

        if (!this.analyser) {
            this.analyser = this.ctx.createAnalyser();
            this.analyser.fftSize = 256;
            this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
        }

        this.source.connect(this.analyser);
        this.analyser.connect(this.ctx.destination);

        this.source.onended = () => {
            if (!this.loop) {
                if (this.source) {
                    this.source.onended = null;
                }
                this.source = null;
                this.pauseTime = 0;
                this.seek.value = 0;
                
                const nextIndex = (this.currentIndex + 1) % this.playlist.length;
                this.loadTrack(nextIndex, true);
            }
        };

        this.startTime = this.ctx.currentTime - this.pauseTime;
        this.source.start(0, this.pauseTime);

        this.updateSeek();
        renderVisualizer(this);
    }

    pause() {
        if (!this.source) return;
        const pos = this.ctx.currentTime - this.startTime;
        this.pauseTime = pos;
        this.source.onended = null;
        try { this.source.stop(0); } catch(e) {}
        this.source.disconnect();
        this.source = null;
    }

    stop() {
        if (this.source) {
            this.source.onended = null;
            try { this.source.stop(0); } catch(e) {}
            this.source.disconnect();
        }
        this.source = null;
        this.pauseTime = 0;
        this.seek.value = 0;
    }

    nextTrack() {
        this.stop();
        this.loadTrack((this.currentIndex + 1) % this.playlist.length, true);
    }

    prevTrack() {
        this.stop();
        this.loadTrack((this.currentIndex - 1 + this.playlist.length) % this.playlist.length, true);
    }

    updateSeek() {
        // HIER IST DER FIX: Wenn der Song gestoppt/beendet wurde, breche die Schleife sofort ab!
        if (!this.source) return;

        const buffer = this.audioCache[this.currentIndex];
        if (!buffer) return;

        const pos = (this.ctx.currentTime - this.startTime) % buffer.duration;
        this.seek.value = (pos / buffer.duration) * 100;
        requestAnimationFrame(() => this.updateSeek());
    }
}

/* =========================================================
   VISUALIZER
========================================================= */
const vizCanvas = document.getElementById("cyberVisualizer");
const vizCtx = vizCanvas.getContext("2d");

function renderVisualizer(player) {
    if (!player || !player.analyser) return;

    player.analyser.getByteFrequencyData(player.dataArray);

    const w = vizCanvas.width;
    const h = vizCanvas.height;
    vizCtx.clearRect(0, 0, w, h);

    const barCount = player.dataArray.length / 2;
    const barWidth = w / barCount;

    for (let i = 0; i < barCount; i++) {
        const v = player.dataArray[i] / 255;
        const barHeight = v * (h - 20);

        const x = i * barWidth;
        const y = h - barHeight;
        const t = i / barCount;

        let r, g, b;
        if (t < 0.5) {
            const k = t / 0.5;
            r = 0 + (160 * k);
            g = 255 - (153 * k);
            b = 240 + (15 * k);
        } else {
            const k = (t - 0.5) / 0.5;
            r = 160 + (95 * k);
            g = 102 + (153 * k);
            b = 255 + (0 * k);
        }

        const alpha = 0.25 + v * 0.75;
        vizCtx.fillStyle = `rgba(${r},${g},${b},${alpha})`;

        const radius = 3;
        const bw = barWidth * 0.8;
        const bx = x + (barWidth - bw) / 2;

        vizCtx.beginPath();
        vizCtx.moveTo(bx + radius, y);
        vizCtx.lineTo(bx + bw - radius, y);
        vizCtx.quadraticCurveTo(bx + bw, y, bx + bw, y + radius);
        vizCtx.lineTo(bx + bw, y + barHeight - radius);
        vizCtx.quadraticCurveTo(bx + bw, y + barHeight, bx + bw - radius, y + barHeight);
        vizCtx.lineTo(bx + radius, y + barHeight);
        vizCtx.quadraticCurveTo(bx, y + barHeight, bx, y + barHeight - radius);
        vizCtx.lineTo(bx, y + radius);
        vizCtx.quadraticCurveTo(bx, y, bx + radius, y);
        vizCtx.closePath();
        vizCtx.fill();
    }

    requestAnimationFrame(() => renderVisualizer(player));
}

/* =========================================================
   PLAYLIST INIT
========================================================= */
async function initPlayer() {
    try {
	window.history.replaceState({}, document.title, "/");
        const response = await fetch("assets/playlist.json");
        const playlist = await response.json();
        const playerRoot = document.querySelector(".cyber-player-box");
        const cyberPlayer = new CyberPlaylistPlayer(playerRoot, playlist);
    } catch (e) {
        console.error("Kritischer Fehler beim Initialisieren des Players:", e);
    }
}

initPlayer();
</script>
