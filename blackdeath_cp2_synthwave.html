<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>BLACKDEATH – CP2 SYNTHWAVE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
    /* =========================================================
       GLOBAL & RESET STYLES
    ========================================================= */
    * { 
        margin: 0; 
        padding: 0; 
        box-sizing: border-box; 
    }

    body {
        background: #000;
        font-family: 'Orbitron', sans-serif;
        overflow: hidden; 
        color: #ff00ff;
        scrollbar-color: rgb(22, 206, 252, 0.7) rgb(176, 19, 190, 0.3);
    }

    /* =========================================================
       THEME SWITCH
    ========================================================= */
    .theme-switch {
        position: fixed;
        top: 20px;
        right: 20px;
        display: flex;
        gap: 10px;
        z-index: 9999; 
    }

    .theme-switch a {
        padding: 6px 12px;
        border-radius: 10px;
        font-size: 0.75rem;
        text-decoration: none;
        font-weight: 700;
        background: rgba(176, 19, 190, 0.3);
        border: 1px solid rgba(255, 150, 200, 0.6);
        color: #ff6fb7;
        backdrop-filter: blur(6px); 
        transition: all 0.15s ease-in-out;
    }

    .theme-switch a:hover {
        background: rgba(97, 219, 250, 0.8);
        color: #fff;
        box-shadow: 0 0 10px rgba(255, 150, 200, 0.6);
    }

        .playlist-switch {
        position: fixed;
        top: 20px;
        left: 20px;
        display: flex;
        gap: 10px;
        z-index: 9999; 
    }

    .playlist-switch a {
        padding: 6px 12px;
        border-radius: 10px;
        font-size: 0.75rem;
        text-decoration: none;
        font-weight: 700;
        background: rgba(176, 19, 190, 0.3);
        border: 1px solid rgba(255, 150, 200, 0.6);
        color: #ff6fb7;
        backdrop-filter: blur(6px); 
        transition: all 0.15s ease-in-out;
    }

    .playlist-switch a:hover {
        background: rgba(97, 219, 250, 0.8);
        color: #fff;
        box-shadow: 0 0 10px rgba(255, 150, 200, 0.6);
    }
    /* =========================================================
       SYNTHWAVE SONNE
    ========================================================= */
    .sun {
        position: fixed;
        top: 5%;
        left: 50%;
        transform: translateX(-50%);
        width: 420px;
        height: 420px;
        border-radius: 50%;
        background: linear-gradient(to bottom, #ffea00, #ff9900, #ff0066);
        box-shadow:
            0 0 40px #ff00aa,
            0 0 120px #ff0066,
            0 0 200px rgba(255, 0, 120, 0.5);
        z-index: 0;
        overflow: hidden;
    }

    .sun::after {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 12px,
            rgba(0, 0, 0, 0.25) 12px,
            rgba(0, 0, 0, 0.25) 18px
        );
    }

    /* =========================================================
       3D PERSPEKTIV-GITTER
    ========================================================= */
    .grid {
        position: fixed;
        left: -50%;
        bottom: 0%;
        width: 200%;
        height: 100%;
        background-image:
            linear-gradient(rgba(255, 0, 255, 0.4) 2px, transparent 2px),
            linear-gradient(90deg, rgba(255, 0, 255, 0.4) 2px, transparent 2px);
        background-size: 80px 80px;
        transform: perspective(1000px) rotateX(80deg);
        transform-origin: bottom;
        animation: gridMove 10s linear infinite;
        z-index: 0;
    }

    @keyframes gridMove {
        from { background-position: 0 0; }
        to   { background-position: 0 80px; }
    }

    /* =========================================================
       VHS RETRO-EFFEKT
    ========================================================= */
    .vhs {
        position: fixed;
        inset: 0;
        pointer-events: none; 
        background: repeating-linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.2),
            rgba(255, 255, 255, 0.2) 1px,
            transparent 1px,
            transparent 4px
        );
        mix-blend-mode: overlay;
        opacity: 0.6;
        z-index: 999;
    }

    /* =========================================================
       STARFIELD CANVAS
    ========================================================= */
    #starfield {
        position: fixed;
        inset: 0;
        z-index: -1;
    }

    /* =========================================================
       TITEL
    ========================================================= */
    .title {
        position: fixed;
        top: 40px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 3.5rem;
        letter-spacing: 10px;
        color: #ff00ff;
        text-shadow:
            0 0 10px #ff00ff,
            0 0 20px #ff00ff,
            0 0 40px #00ffff,
            0 0 80px #0088ff;
    }

    /* =========================================================
       CYBERPLAYER BOX CONTAINER
    ========================================================= */
    .cyber-player-box {
        position: fixed;
        bottom: 50px; 
        left: 50%;
        transform: translateX(-50%);
        width: 50%;
        min-width: 500px;
        max-width: 900px;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 0, 255, 0.4);
        border-radius: 14px;
        padding: 16px 20px 12px 20px;
        box-shadow:
            0 0 25px rgba(255, 0, 255, 0.25),
            inset 0 0 20px rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(14px); 
        z-index: 20;
    }

    .cyber-player-title {
        text-align: center;
        font-size: 1rem;
        letter-spacing: 4px;
        margin-bottom: 10px;
        color: #ff00ff;
        text-shadow: 0 0 10px #ff00ff, 0 0 20px #00ffff;
    }

    /* =========================================================
       PLAYER BUTTONS
    ========================================================= */
    .cyber-player-controls {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 10px;
    }

    .cyber-btn {
        background: linear-gradient(135deg, #00ffff, #ff00ff);
        color: #001010;
        border: 1px solid rgba(255, 0, 255, 0.6);
        padding: 6px 14px;
        border-radius: 999px;
        font-weight: 700;
        cursor: pointer;
        text-shadow: 0 0 4px rgba(255, 255, 255, 0.4);
        box-shadow:
            0 0 10px rgba(255, 0, 255, 0.6),
            0 0 18px rgba(0, 255, 255, 0.5);
        transition: all 0.15s ease-in-out;
    }

    .cyber-btn:hover {
        filter: brightness(1.2);
        box-shadow:
            0 0 14px rgba(255, 0, 255, 1),
            0 0 22px rgba(0, 255, 255, 0.8);
    }

    /* =========================================================
       LOOP & SEEKBAR
    ========================================================= */
    .cyber-loop-label {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-bottom: 6px;
        font-size: 0.8rem;
        color: #ff99ff;
        user-select: none;
    }

    .cyber-loop-label input {
        accent-color: #ff00ff; 
    }

    .cyber-seek {
        width: 100%;
        height: 4px;
        border-radius: 999px;
        background: linear-gradient(90deg, #00ffff, #ff00ff, #0088ff);
        margin-bottom: 10px;
        -webkit-appearance: none;
        appearance: none;
        cursor: pointer;
    }

    .cyber-seek::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #ffffff;
        border: 2px solid #ff00ff;
        box-shadow: 0 0 10px #ff00ff;
    }

    /* =========================================================
       PLAYLIST
    ========================================================= */
    .cyber-playlist {
        text-align: center;
        max-height: 140px;
        overflow-y: auto;
        margin-bottom: 10px;
    }

    .cyber-track {
        padding: 6px 8px;
        margin-bottom: 4px;
        border-radius: 8px;
        background: rgba(255, 0, 255, 0.05);
        border: 1px solid rgba(255, 0, 255, 0.2);
        cursor: pointer;
        transition: all 0.15s ease;
        color: #ffccff;
        font-size: 0.85rem;
    }

    .cyber-track:hover {
        background: rgba(255, 0, 255, 0.15);
    }

    .cyber-track.active {
        background: linear-gradient(90deg, rgba(0, 255, 255, 0.4), rgba(255, 0, 255, 0.4));
        color: #fff;
        border-color: #ffffff;
        box-shadow:
            0 0 12px #ff00ff,
            0 0 18px #00ffff;
    }

    /* =========================================================
       CANVAS VISUALIZER
    ========================================================= */
    #cyberVisualizer {
        width: 100%;
        height: 140px;
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 0, 255, 0.35);
        border-radius: 10px;
        box-shadow:
            0 0 18px rgba(255, 0, 255, 0.35),
            inset 0 0 18px rgba(0, 0, 0, 0.9);
    }

    /* =========================================================
       LOGO
    ========================================================= */
    .logo {
        position: fixed;
        left: 50%;
        top: 27%;
        transform: translate(-50%, -50%); 
        width: min(50vw, 50vh);
        z-index: 10;
        animation: float 5s ease-in-out infinite;
        filter:
            drop-shadow(0 0 20px rgb(233, 0, 136))
            drop-shadow(0 0 40px #e9a136)
            drop-shadow(0 0 60px #d60df1);
    }

    @keyframes float {
        0%, 100% { translate: 0 0px; }
        50%      { translate: 0 -15px; }
    }
    </style>
</head>
<body>

<div class="theme-switch">
    <a href="blackdeath_cp1_amber.html">AMBER</a>
    <a href="blackdeath_cp2_synthwave.html">SYNTHWAVE</a>
    <a href="blackdeath_cp3_darktech.html">DARKTECH</a>
    <a href="blackdeath_cp4_kawaii.html">KAWAII</a>
    <a href="blackdeath_cp5_holo.html">HOLO</a>
</div>

<div class="playlist-switch">
    <a href="assets/loops.json">Loops</a>
    <a href="assets/webradio.json">WebRadio</a>
</div>

<canvas id="starfield"></canvas>

<div class="sun"></div>
<div class="grid"></div>
<div class="vhs"></div>

<img class="logo" src="assets/img_player/cyber_vapor_logo.webp" alt="Logo">

<div class="cyber-player-box">
    <div class="cyber-player-title">AUDIO NODE // SYNTHWAVE MODE</div>

    <div class="cyber-player-controls">
        <button class="cyber-btn prev">⏮ PREV</button>
        <button class="cyber-btn play">▶ PLAY</button>
        <button class="cyber-btn pause">⏸ PAUSE</button>
        <button class="cyber-btn stop">⏹ STOP</button>
        <button class="cyber-btn next">⏭ NEXT</button>
    </div>

    <label class="cyber-loop-label">
        <input type="checkbox" class="loop" checked> LOOP ENABLED
    </label>

    <input type="range" class="cyber-seek" value="0" min="0" max="100" step="0.1">

    <div class="cyber-playlist"></div>

    <canvas id="cyberVisualizer" width="800" height="140"></canvas>
</div>

<script>
/* =============================================================================
   1. STERNENHIMMEL ANIMATION
   ============================================================================= */
const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');

let stars = [];
const numStars = 500;

const colors = [
    'rgba(255, 255, 255, ',  
    'rgba(173, 216, 230, ',  
    'rgba(255, 255, 224, ',  
    'rgba(255, 240, 245, ',  
    'rgba(135, 206, 250, '   
];

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    stars = [];
    for (let i = 0; i < numStars; i++) {
        stars.push(new Star());
    }
}

class Star {
    constructor() {
        this.reset();
    }

    reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2.5; 
        this.speed = Math.random() * 0.5 + 0.2; 
        this.alpha = Math.random(); 
        this.colorBase = colors[Math.floor(Math.random() * colors.length)];
        
        this.twinkleSpeed = Math.random() * 0.03 + 0.01;
        this.twinkleDirection = Math.random() > 0.5 ? 1 : -1;
    }

    update() {
        this.y += this.speed;

        if (this.y > canvas.height) {
            this.y = 0;
            this.x = Math.random() * canvas.width;
        }

        this.alpha += this.twinkleSpeed * this.twinkleDirection;
        if (this.alpha >= 1) {
            this.alpha = 1;
            this.twinkleDirection = -1;
        } else if (this.alpha <= 0.2) {
            this.alpha = 0.2;
            this.twinkleDirection = 1;
        }
    }

    draw() {
        ctx.fillStyle = `${this.colorBase}${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

resizeCanvas();

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let star of stars) {
        star.update();
        star.draw();
    }
    requestAnimationFrame(animate);
}
animate();

window.addEventListener('resize', resizeCanvas);


/* =============================================================================
   2. AUDIO CORE ENGINE (Streaming Version via HTML5 Audio + Web Audio API Node)
   ============================================================================= */
class CyberPlaylistPlayer {
    constructor(root, playlist) {
        this.root = root;
        this.playlist = playlist;
        this.currentIndex = 0;

        // Audio HTML5 Element erstellen (für echtes Streaming ohne Preload)
        this.audio = new Audio();
        this.audio.crossOrigin = "anonymous";

        this.ctx = null;
        this.sourceNode = null;
        this.analyser = null;
        this.dataArray = null;
        
        this.loop = true;
        this.isDragging = false;
        this.visualizerActive = false;

        this.buildRefs();
        this.renderPlaylist();
        this.loadTrack(0, false);
    }

    buildRefs() {
        this.playBtn = this.root.querySelector(".play");
        this.pauseBtn = this.root.querySelector(".pause");
        this.stopBtn = this.root.querySelector(".stop");
        this.prevBtn = this.root.querySelector(".prev");
        this.nextBtn = this.root.querySelector(".next");
        this.seek = this.root.querySelector(".cyber-seek");
        this.loopToggle = this.root.querySelector(".loop");
        this.listBox = this.root.querySelector(".cyber-playlist");

        this.playBtn.onclick = () => this.play();
        this.pauseBtn.onclick = () => this.pause();
        this.stopBtn.onclick = () => this.stop();
        this.prevBtn.onclick = () => this.prevTrack();
        this.nextBtn.onclick = () => this.nextTrack();

        this.loopToggle.onchange = () => {
            this.loop = this.loopToggle.checked;
            this.audio.loop = this.loop;
        };

        this.seek.oninput = () => { this.isDragging = true; };
        this.seek.onchange = () => {
            if (isNaN(this.audio.duration)) return;
            this.audio.currentTime = (this.seek.value / 100) * this.audio.duration;
            this.isDragging = false;
        };

        this.seek.onmouseup = () => { this.isDragging = false; };
        this.seek.ontouchend = () => { this.isDragging = false; };
        
        // Native Audio-Events für Status-Updates nutzen
        this.audio.ontimeupdate = () => this.updateSeek();
        this.audio.onended = () => {
            if (!this.loop) {
                this.nextTrack();
            }
        };
    }

    renderPlaylist() {
        this.listBox.innerHTML = "";
        this.playlist.forEach((track, i) => {
            const item = document.createElement("div");
            item.className = "cyber-track" + (i === this.currentIndex ? " active" : "");
            item.textContent = track.name;
            item.onclick = () => this.loadTrack(i, true);
            this.listBox.appendChild(item);
        });
    }

    updatePlaylist(newPlaylist) {
    // 1. Aktuelle Wiedergabe stoppen
    this.stop();
    
    // 2. Die neue Playlist zuweisen und Index zurücksetzen
    this.playlist = newPlaylist;
    this.currentIndex = 0;
    
    // 3. Die Playlist im HTML neu rendern
    this.renderPlaylist();
    
    // 4. Den ersten Track der neuen Playlist laden (ohne Autoplay)
    this.loadTrack(0, false);
    }

    highlightActive() {
        this.listBox.querySelectorAll(".cyber-track").forEach((el, i) => {
            const isActive = i === this.currentIndex;
            el.classList.toggle("active", isActive);
            if (isActive) {
                el.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }
        });
    }

    initAudioEngine() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.analyser = this.ctx.createAnalyser();
            this.analyser.fftSize = 128;
            this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
            
            // Audio-Element mit Web Audio API verknüpfen (Streamen & Visualisieren gleichzeitig)
            this.sourceNode = this.ctx.createMediaElementSource(this.audio);
            this.sourceNode.connect(this.analyser);
            this.analyser.connect(this.ctx.destination);
        }
    }

    loadTrack(index, autoplay = false) {
        this.currentIndex = index;
        this.highlightActive();
        
        this.audio.src = this.playlist[index].src;
        this.audio.loop = this.loop;
        this.seek.value = 0;

        if (autoplay) {
            this.play();
        } else {
            clearVisualizerCanvas();
        }
    }

    play() {
        this.initAudioEngine();
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }

        this.audio.play().catch(e => console.log("Abspiel-Fehler:", e));

        if (!this.visualizerActive) {
            this.visualizerActive = true;
            renderVisualizer(this);
        }
    }

    pause() {
        this.audio.pause();
    }

    stop() {
        this.audio.pause();
        this.audio.currentTime = 0;
        this.seek.value = 0;
    }

    nextTrack() {
        const nextIndex = (this.currentIndex + 1) % this.playlist.length;
        this.loadTrack(nextIndex, true);
    }

    prevTrack() {
        const prevIndex = (this.currentIndex - 1 + this.playlist.length) % this.playlist.length;
        this.loadTrack(prevIndex, true);
    }

    updateSeek() {
        if (this.isDragging || isNaN(this.audio.duration) || this.audio.duration === 0) return;
        this.seek.value = (this.audio.currentTime / this.audio.duration) * 100;
    }
}


/* =============================================================================
   3. AUDIO VISUALIZER GRAPHICS
   ============================================================================= */
const vizCanvas = document.getElementById("cyberVisualizer");
const vizCtx = vizCanvas.getContext("2d");

function clearVisualizerCanvas() {
    const w = vizCanvas.width;
    const h = vizCanvas.height;
    vizCtx.clearRect(0, 0, w, h);
}

function renderVisualizer(player) {
    if (!player || !player.analyser) return;

    // SENSE: Wenn Audio läuft, lies die echten Daten aus.
    // Wenn es pausiert/gestoppt ist, rechne die alten Werte schrittweise runter.
    if (player.audio && !player.audio.paused) {
        player.analyser.getByteFrequencyData(player.dataArray);
    } else {
        // DÄMPFUNGS-LOGIK:
        // Jeder Wert im Array wird pro Frame um 15% verringert (Wert * 0.85)
        for (let i = 0; i < player.dataArray.length; i++) {
            player.dataArray[i] = Math.floor(player.dataArray[i] * 0.85);
        }
    }

    const w = vizCanvas.width;
    const h = vizCanvas.height;
    vizCtx.clearRect(0, 0, w, h);

    const barCount = player.dataArray.length / 2;
    const barWidth = w / barCount;

    for (let i = 0; i < barCount; i++) {
        const v = player.dataArray[i] / 255; 
        const barHeight = v * (h - 20);

        const x = i * barWidth;
        const y = h - barHeight;

        const t = i / barCount;
        let r, g, b;

        if (t < 0.5) {
            const k = t / 0.5;
            r = Math.floor(255 * k);
            g = Math.floor(255 - (255 * k));
            b = 255;
        } else {
            const k = (t - 0.5) / 0.5;
            r = Math.floor(255 - (255 * k));
            g = Math.floor(136 * k);
            b = 255;
        }

        const alpha = 0.25 + v * 0.75;
        vizCtx.fillStyle = `rgba(${r},${g},${b},${alpha})`;

        const radius = 3;
        const bw = barWidth * 0.8; 
        const bx = x + (barWidth - bw) / 2;

        vizCtx.beginPath();
        vizCtx.moveTo(bx + radius, y);
        vizCtx.lineTo(bx + bw - radius, y);
        vizCtx.quadraticCurveTo(bx + bw, y, bx + bw, y + radius);
        vizCtx.lineTo(bx + bw, y + barHeight - radius);
        vizCtx.quadraticCurveTo(bx + bw, y + barHeight, bx + bw - radius, y + barHeight);
        vizCtx.lineTo(bx + radius, y + barHeight);
        vizCtx.quadraticCurveTo(bx, y + barHeight, bx, y + barHeight - radius);
        vizCtx.lineTo(bx, y + radius);
        vizCtx.quadraticCurveTo(bx, y, bx + radius, y);
        vizCtx.closePath();
        vizCtx.fill();
    }

    requestAnimationFrame(() => renderVisualizer(player));
}


/* =============================================================================
   4. APP INITIALISIERUNG
   ============================================================================= */
let cyberPlayer = null;

async function initPlayer() {
    try {
        localStorage.setItem("lastCyberPlayer", "blackdeath_cp2_synthwave.html");
        window.history.replaceState({}, document.title, "/");
        // Erste Playlist (Standard) laden
        const response = await fetch("assets/loops.json");
        const playlist = await response.json();
        const playerRoot = document.querySelector(".cyber-player-box");
        
        // Player-Instanz globaler Variable zuweisen
        cyberPlayer = new CyberPlaylistPlayer(playerRoot, playlist);
        
        // Starte den Render-Loop einmalig global
        renderVisualizer(cyberPlayer);

        // --- HIER NEU: Playlist-Switch Event-Listener einrichten ---
        setupPlaylistSwitch();

    } catch (e) {
        console.error("Kritischer Fehler beim Initialisieren des Players:", e);
    }
}

// Funktion, die die Links abfängt
function setupPlaylistSwitch() {
    const switchLinks = document.querySelectorAll(".playlist-switch a");
    
    switchLinks.forEach(link => {
        link.addEventListener("click", async (event) => {
            // Verhindert, dass der Browser die JSON-Datei als Textseite öffnet
            event.preventDefault(); 
            
            // Holt den Pfad aus dem href-Attribut (z.B. "assets/webradio.json")
            const jsonUrl = link.getAttribute("href");
            
            try {
                // Neue JSON-Datei fetchen
                const response = await fetch(jsonUrl);
                if (!response.ok) throw new Error(`Fehler beim Laden von ${jsonUrl}`);
                
                const newPlaylist = await response.json();
                
                // Neue Playlist in den Player einspeisen
                if (cyberPlayer) {
                    cyberPlayer.updatePlaylist(newPlaylist);
                    console.log(`Playlist erfolgreich gewechselt zu: ${jsonUrl}`);
                }
            } catch (error) {
                console.error("Fehler beim Wechseln der Playlist:", error);
            }
        });
    });
}

initPlayer();
</script>
