<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACKDEATH // AUDIO TERMINAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="player/core.css">
</head>
<body data-config="blackdeath_config.json">

<div class="theme-switch"><select id="themeSelect" aria-label="Theme auswählen"></select></div>
<div class="playlist-switch"><select id="playlistSelect" aria-label="Playlist auswählen"></select></div>

<!-- Theme-Deko (wird aus player/themes/<theme>/decor.html eingesetzt) -->
<div id="themeDecor"></div>
<canvas id="bgCanvas"></canvas>
<img class="logo" id="themeLogo" alt="Logo">

<div class="cyber-player-box">
    <div class="cyber-player-title"></div>

    <div class="cyber-player-controls">
        <button class="cyber-btn prev"><span class="btn-icon">⏮</span><span class="btn-label">PREV</span></button>
        <button class="cyber-btn play"><span class="btn-icon">▶</span><span class="btn-label">PLAY</span></button>
        <button class="cyber-btn pause"><span class="btn-icon">⏸</span><span class="btn-label">PAUSE</span></button>
        <button class="cyber-btn stop"><span class="btn-icon">⏹</span><span class="btn-label">STOP</span></button>
        <button class="cyber-btn next"><span class="btn-icon">⏭</span><span class="btn-label">NEXT</span></button>
    </div>

    <label class="cyber-loop-label">
        <input type="checkbox" class="loop" checked>
        <span class="loop-label-text"></span>
    </label>

    <input type="range" class="cyber-seek" value="0" min="0" max="100" step="0.1">
    <div class="cyber-playlist"></div>
    <canvas id="cyberVisualizer" width="800" height="140"></canvas>
</div>

<script src="player/effects.js"></script>
<script src="player/player.js"></script>
</body>
</html>
